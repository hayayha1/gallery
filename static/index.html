<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>画廊 · 艺术展览</title>
  <style>
    /* ========================================================
       1. 基础重置与色彩变量系统
       ======================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      /* 当前主题变量 (随系列动态平滑平滑过渡) */
      --theme-bg: #0b0f17;
      --theme-bg-gradient: radial-gradient(circle at 75% 35%, #182235 0%, #0b0f17 100%);
      --theme-accent: #38bdf8;
      --theme-accent-glow: rgba(56, 189, 248, 0.45);
      --theme-text: #ffffff;
      --theme-text-muted: #94a3b8;
      --theme-border: rgba(255, 255, 255, 0.12);
      --theme-grid-line: rgba(56, 189, 248, 0.18);
      --ease-elastic: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-smooth: cubic-bezier(0.16, 1, 0.3, 1);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background-color: var(--theme-bg);
      color: var(--theme-text);
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
      transition: background-color 0.8s var(--ease-smooth);
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    /* 全屏动态背景 Canvas (深空宇宙旗舰版：电离星云暗涌、时空引力曲率网格、3D景深星海、偶发微流星) */
    #bgCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      transition: opacity 0.6s ease;
    }

    /* 滚动条美化 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--theme-accent);
    }

    /* ========================================================
       2. 顶部工具栏 (Navbar)
       保留：主页、搜索、音频控制，以及右侧参考图风格导航指示
       ======================================================== */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 70px;
      z-index: 100;
      display: flex;
      align-items: center;
      padding: 0 40px;
      background: linear-gradient(to bottom, rgba(11, 15, 23, 0.85) 0%, transparent 100%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .navbar-container {
      width: 100%;
      max-width: 1800px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* 品牌区 */
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      text-decoration: none;
    }
    .brand-logo-badge {
      background: linear-gradient(135deg, #ff2a85 0%, #ff529a 100%);
      color: white;
      font-weight: 800;
      font-size: 15px;
      padding: 4px 14px;
      border-radius: 9999px;
      letter-spacing: -0.5px;
      box-shadow: 0 4px 12px rgba(255, 42, 133, 0.35);
    }
    .brand-title {
      font-size: 19px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.5px;
    }

    /* 中部搜索与主页 */
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 16px;
      border-radius: 9999px;
      font-size: 13.5px;
      font-weight: 600;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      transition: all 0.25s ease;
      text-decoration: none;
    }
    .nav-btn:hover, .nav-btn.active {
      color: #ffffff;
      border-color: var(--theme-accent);
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 0 14px var(--theme-accent-glow);
    }

    /* 搜索框 */
    .search-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 240px;
      transition: width 0.3s var(--ease-smooth);
    }
    .search-wrapper.focused {
      width: 340px;
    }
    .search-icon {
      position: absolute;
      left: 12px;
      color: #94a3b8;
      pointer-events: none;
      width: 15px;
      height: 15px;
    }
    .search-input {
      width: 100%;
      height: 36px;
      padding: 6px 34px 6px 36px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.06);
      font-size: 13px;
      color: #ffffff;
      outline: none;
      transition: all 0.2s;
    }
    .search-input:focus {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--theme-accent);
      box-shadow: 0 0 16px var(--theme-accent-glow);
    }
    .search-clear {
      position: absolute;
      right: 12px;
      background: rgba(255, 255, 255, 0.2);
      border: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: white;
      font-size: 11px;
    }
    .search-clear.visible { display: flex; }
    .search-shortcut {
      position: absolute;
      right: 12px;
      padding: 1px 5px;
      background: rgba(255, 255, 255, 0.15);
      color: #94a3b8;
      font-size: 11px;
      border-radius: 4px;
      pointer-events: none;
      font-family: monospace;
    }

    /* 右侧参考图风格导航指示 (首页 页面 一一一 01 / 03) */
    .nav-reference-indicator {
      display: flex;
      align-items: center;
      gap: 24px;
      font-size: 14px;
      color: #cbd5e1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .nav-link-item {
      cursor: pointer;
      transition: color 0.2s;
      letter-spacing: 1px;
    }
    .nav-link-item:hover, .nav-link-item.active {
      color: #ffffff;
      font-weight: 600;
    }
    .nav-dash-progress {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: monospace;
      color: #94a3b8;
    }
    .nav-dashes {
      letter-spacing: 3px;
      color: var(--theme-accent);
      font-weight: 700;
      opacity: 0.85;
    }
    .nav-counter {
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
    }
    .nav-counter span {
      color: #64748b;
      font-size: 13px;
      font-weight: 400;
    }

    /* 全局音频氛围开关 */
    .audio-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.06);
      color: #cbd5e1;
      font-size: 12px;
      cursor: pointer;
      font-family: monospace;
      transition: all 0.25s;
    }
    .audio-pill:hover, .audio-pill.playing {
      border-color: var(--theme-accent);
      color: #ffffff;
      box-shadow: 0 0 12px var(--theme-accent-glow);
    }
    .audio-waveform {
      display: flex;
      align-items: center;
      gap: 2.5px;
      height: 12px;
    }
    .audio-bar {
      width: 2.5px;
      height: 4px;
      background: #64748b;
      border-radius: 2px;
      transition: height 0.2s, background-color 0.2s;
    }
    .audio-pill.playing .audio-bar {
      background: var(--theme-accent);
      animation: soundWave 1.1s ease-in-out infinite alternate;
    }
    .audio-pill.playing .audio-bar:nth-child(1) { animation-delay: 0.1s; }
    .audio-pill.playing .audio-bar:nth-child(2) { animation-delay: 0.3s; }
    .audio-pill.playing .audio-bar:nth-child(3) { animation-delay: 0.2s; }
    .audio-pill.playing .audio-bar:nth-child(4) { animation-delay: 0.4s; }

    @keyframes soundWave {
      0% { height: 3px; }
      100% { height: 13px; }
    }

    /* ========================================================
       3. 方案一：【连续空间穿梭 · 卡片 3D 升空蜕变】 (Spatial Morph & Zoom)
       ======================================================== */
    /* 飞行代理卡片：从主页卡片无缝飞升形变至 3D 展台主角 */
    .morph-flight-proxy {
      position: fixed;
      z-index: 99999;
      pointer-events: none;
      overflow: hidden;
      background: #0d121c;
      border: 1.5px solid rgba(255, 255, 255, 0.28);
      box-shadow: 0 35px 80px rgba(0, 0, 0, 0.85), 0 0 35px var(--theme-accent-glow, rgba(56, 189, 248, 0.4));
      transform-style: preserve-3d;
      will-change: left, top, width, height, transform, border-radius, box-shadow;
      transition: left 0.82s cubic-bezier(0.16, 1, 0.3, 1),
                  top 0.82s cubic-bezier(0.16, 1, 0.3, 1),
                  width 0.82s cubic-bezier(0.16, 1, 0.3, 1),
                  height 0.82s cubic-bezier(0.16, 1, 0.3, 1),
                  border-radius 0.82s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.82s cubic-bezier(0.16, 1, 0.3, 1),
                  box-shadow 0.82s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .morph-flight-proxy img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .morph-flight-glare {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0) 65%);
      pointer-events: none;
      mix-blend-mode: overlay;
    }

    /* 主页其他卡片在卡片升空时的景深退后虚化 */
    .home-card.receding {
      transform: scale(0.94) translateY(12px) !important;
      opacity: 0.25 !important;
      filter: blur(4px) brightness(0.5) !important;
      pointer-events: none !important;
      transition: all 0.6s var(--ease-smooth) !important;
    }

    /* 优雅浮动 HUD 提示，配合渐变流光 */
    .transition-curtain {
      position: fixed;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      z-index: 9999;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.4s var(--ease-smooth);
    }
    .transition-curtain.active {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .curtain-text {
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 10px 24px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6), 0 0 20px var(--theme-accent-glow);
    }
    .curtain-spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-top-color: var(--theme-accent);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 视图切换容器 */
    .view-section {
      display: none;
      width: 100%;
      min-height: 100vh;
      position: relative;
      z-index: 1;
    }
    .view-section.current {
      display: block;
    }

    /* ========================================================
       4. 视图一：主页系列瀑布流 (Home Grid View)
       ======================================================== */
    .home-container {
      width: 100%;
      max-width: 1800px;
      margin: 0 auto;
      padding: 94px 32px 80px 32px;
    }
    .home-status-bar {
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #94a3b8;
      font-size: 14px;
    }
    .home-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.06);
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-weight: 500;
    }
    .home-status-badge span {
      color: var(--theme-accent);
      font-weight: 700;
    }

    .masonry-grid {
      display: flex;
      gap: 22px;
      width: 100%;
      align-items: flex-start;
    }
    .masonry-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 22px;
      min-width: 0;
    }
    .home-card {
      position: relative;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      transition: transform 0.4s var(--ease-smooth),
                  box-shadow 0.4s var(--ease-smooth),
                  border-color 0.4s ease;
    }
    .home-card:hover {
      transform: translateY(-8px) scale(1.01);
      box-shadow: 0 24px 45px -8px var(--theme-accent-glow), 0 10px 20px rgba(0, 0, 0, 0.5);
      border-color: var(--theme-accent);
    }
    .home-card-media {
      position: relative;
      width: 100%;
      background: #0f172a;
      overflow: hidden;
    }
    .home-card-img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.6s var(--ease-smooth);
    }
    .home-card:hover .home-card-img {
      transform: scale(1.04);
    }
    .home-card-badge {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(8px);
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 11px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 5px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .home-card:hover .home-card-badge {
      background: var(--theme-accent);
      color: #000000;
      font-weight: 700;
    }
    .home-card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(10, 13, 20, 0.95) 0%, rgba(10, 13, 20, 0.35) 50%, transparent 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 22px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .home-card:hover .home-card-overlay {
      opacity: 1;
    }
    .home-card-title {
      color: #ffffff;
      font-size: 16.5px;
      font-weight: 700;
      margin-bottom: 6px;
      word-break: break-all;
    }
    .home-card-hint {
      color: var(--theme-accent);
      font-size: 12px;
      font-weight: 600;
    }

    /* ========================================================
       5. 视图二：【HuyML 风格 3D 轮转展台】：全视口深景深 + 图文紧密联动
       ======================================================== */
    .stage-view-wrapper {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
      padding: 0;
    }

    /* 3D 透视流动视口：铺满全屏，让卡片对角线自由贯穿 */
    .stage-stream-area {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      perspective: 1500px;
      perspective-origin: 50% 50%;
      overflow: visible;
      cursor: grab;
      user-select: none;
      z-index: 5;
    }
    .stage-stream-area:active {
      cursor: grabbing;
    }

    .stage-3d-deck {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      transform-style: preserve-3d;
      pointer-events: none;
    }

    /* 每一个 3D 卡片槽位 */
    .deck-card-item {
      position: absolute;
      width: 360px;
      height: 510px;
      border-radius: 18px;
      cursor: pointer;
      transform-style: preserve-3d;
      will-change: transform, opacity, filter, box-shadow;
      transition: box-shadow 0.35s ease, border-color 0.35s ease;
      background: #0d121c;
      border: 1.5px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 25px 60px -10px rgba(0, 0, 0, 0.85);
      user-select: none;
      pointer-events: auto;
    }

    /* 当前展示照片主角位高亮增强 */
    .deck-card-item.is-active {
      border-color: rgba(255, 255, 255, 0.9);
      box-shadow: 0 40px 95px -10px rgba(0, 0, 0, 0.95), 0 0 50px var(--theme-accent-glow);
    }

    .deck-card-item:hover {
      border-color: var(--theme-accent);
    }

    /* 卡片顶部的 P1 / P2 / P3 标注文本 */
    .deck-card-tag {
      position: absolute;
      top: -48px;
      left: 4px;
      font-size: 40px;
      font-weight: 800;
      font-family: Georgia, "Times New Roman", "Songti SC", "SimSun", serif;
      color: #ffffff !important;
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.95);
      pointer-events: none;
      z-index: 10 !important;
      letter-spacing: 1px;
    }

    /* 卡片图片容器 */
    .deck-card-media {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      border-radius: 16px;
    }
    .deck-card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    /* 滚动交互提示徽章 */
    .stage-scroll-badge {
      position: absolute;
      bottom: 28px;
      left: 36px;
      padding: 7px 16px;
      border-radius: 9999px;
      border: 1px solid rgba(56, 189, 248, 0.35);
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(10px);
      color: var(--theme-accent);
      font-size: 12px;
      font-family: monospace;
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      z-index: 20;
      animation: pulseScrollBadge 2.4s infinite;
    }
    @keyframes pulseScrollBadge {
      0%, 100% { opacity: 0.75; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-4px); }
    }

    /* ----------------------------------------------------
       图文联动展示区：向右移至 left: 55vw，与主角卡片保持舒适的高级留白
       ---------------------------------------------------- */
    .stage-info-content {
      position: absolute;
      left: 55vw;
      top: 55%;
      transform: translateY(-50%);
      width: 38vw;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 26px;
      padding: 0;
      z-index: 25;
      pointer-events: auto;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .stage-info-content.updating {
      opacity: 0.15;
      transform: translateY(calc(-50% + 6px));
    }

    /* 主标题：P1:倾国 / FATAL BEAUTY */
    .stage-title-block {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .stage-main-title {
      font-size: 52px;
      font-weight: 800;
      color: #ffffff;
      font-family: Georgia, "Times New Roman", "Songti SC", "SimSun", serif;
      letter-spacing: -0.5px;
      line-height: 1.15;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    .stage-sub-title {
      font-size: 40px;
      font-weight: 800;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      letter-spacing: 2px;
      line-height: 1.15;
      text-transform: uppercase;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    /* 杂志正文段落排版 (来自 description 文件) */
    .stage-paragraphs {
      display: flex;
      flex-direction: column;
      gap: 16px;
      font-size: 15px;
      line-height: 1.85;
      color: #cbd5e1;
      text-align: justify;
    }
    .stage-paragraphs p {
      letter-spacing: 0.3px;
    }

    /* READ MORE 按钮 */
    .stage-action-row {
      display: flex;
      align-items: center;
      gap: 28px;
      margin-top: 10px;
    }
    .stage-read-more-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      background: none;
      border: none;
      cursor: pointer;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      letter-spacing: 1.5px;
      transition: all 0.25s ease;
      text-decoration: none;
      padding: 6px 0;
      border-bottom: 2px solid transparent;
    }
    .stage-read-more-btn:hover {
      color: var(--theme-accent);
      border-bottom-color: var(--theme-accent);
      transform: translateX(4px);
    }
    .stage-read-more-btn svg {
      transition: transform 0.25s ease;
    }
    .stage-read-more-btn:hover svg {
      transform: translateX(6px);
    }

    /* ========================================================
       6. 视图三：【单图独立全屏展台】
       ======================================================== */
    .photo-modal-view {

    class DynamicBackgroundEngine {
      constructor(canvasId) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d');
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        
        // 主题与色彩状态
        this.theme = SERIES_THEMES[0];
        
        // 时间轴与带物理阻尼平滑跟踪的交互坐标
        this.time = 0;
        this.mouseX = this.width / 2;
        this.mouseY = this.height / 2;
        this.smoothMouseX = this.width / 2;
        this.smoothMouseY = this.height / 2;

        // 深空星云暗涌
        this.nebulae = [];
        // 横贯深空的流动极光光带 (Aurora Ribbons)
        this.auroraRibbons = [];
        // 三维分层星辰系统 (密集深空)
        this.stars = [];
        // 主角卡片周围漂浮的星际余烬微粒 (Cosmic Embers)
        this.embers = [];
        // 偶发深空微流星
        this.meteors = [];
        this.nextMeteorTime = 4; // 启动后第 4 秒触发首颗微流星
        
        // 时空网格上的光脉冲 (Telemetry Packets)

          { rayIdx: 2, progress: 0.12, speed: 0.0035 },

          { rayIdx: 8, progress: 0.28, speed: 0.0032 }
        ];

        this.initCanvas();
        this.initCosmicElements();
        this.bindEvents();
        this.animate();

        if (!colorStr) return `rgba(56, 189, 248, ${alpha})`;
        if (colorStr.startsWith('rgba')) {
          return colorStr.replace(/[\d.]+\)$/, `${alpha})`);
        }
        if (colorStr.startsWith('#')) {
          const hex = colorStr.replace('#', '');
          const r = parseInt(hex.substring(0, 2), 16) || 56;
          const g = parseInt(hex.substring(2, 4), 16) || 189;
          const b = parseInt(hex.substring(4, 6), 16) || 248;
          return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }
        return colorStr;
      }

      initCanvas() {
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.canvas.width = this.width * window.devicePixelRatio;
        this.canvas.height = this.height * window.devicePixelRatio;
        this.ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
      }

      initCosmicElements() {
        const w = this.width;
        const h = this.height;

        // 1. 初始化深空星云暗涌 (可见度全面提升，呈现丰富色阶)
        this.nebulae = [
          {
            baseX: 0.25, baseY: 0.32,
            radiusRatio: 0.48,
            driftSpeed: 0.0006,
            driftPhase: 0,
            driftRadius: 60,
            alpha: 0.20
          },
          {
            baseX: 0.76, baseY: 0.36,
            radiusRatio: 0.52,
            driftSpeed: 0.0007,
            driftPhase: Math.PI * 0.75,
            driftRadius: 70,
            alpha: 0.16
          },
          {
            baseX: 0.45, baseY: 0.78,
            radiusRatio: 0.55,
            driftSpeed: 0.0005,
            driftPhase: Math.PI * 1.45,
            driftRadius: 65,
            alpha: 0.18
          }
        ];

        // 2. 初始化流动极光光带 (Aurora Ribbons: 填补中上部与左侧大面积空洞)
        this.auroraRibbons = [
          {
            baseY: 0.24,
            thickness: 120,
            amp1: 45,
            amp2: 25,
            freq1: 0.0022,
            freq2: 0.0045,
            phase1: 0,
            phase2: 1.2,
            speed: 0.0008,
            alpha: 0.15
          },
          {
            baseY: 0.42,
            thickness: 150,
            amp1: 55,
            amp2: 30,
            freq1: 0.0018,
            freq2: 0.0038,
            phase1: 2.1,
            phase2: 0.8,
            speed: 0.0006,
            alpha: 0.13
          },
          {
            baseY: 0.68,
            thickness: 140,
            amp1: 40,
            amp2: 28,
            freq1: 0.0025,
            freq2: 0.0050,
            phase1: 3.5,
            phase2: 2.4,
            speed: 0.0007,
            alpha: 0.11
          }
        ];

        // 3. 初始化三维分层密集星海系统 (共约 210 颗星)
        this.stars = [];
        
        // Layer 0: 远景深空微星 (140 颗，0.3~0.8px，真实闪烁，形成丰富星河织锦)
        for (let i = 0; i < 140; i++) {
          this.stars.push({
            layer: 0,
            x: Math.random() * w,
            y: Math.random() * h,
            size: Math.random() * 0.5 + 0.35,
            baseAlpha: Math.random() * 0.55 + 0.30,
            twinkleSpeed: Math.random() * 0.035 + 0.015,
            twinklePhase: Math.random() * Math.PI * 2,
            speedX: (Math.random() - 0.5) * 0.07,
            speedY: (Math.random() - 0.5) * 0.07,
            hasSpike: false,
            colorType: Math.random() > 0.75 ? 'accent' : 'white'
          });
        }

        // Layer 1: 中景主序恒星 (50 颗，1.0~1.9px，光晕饱满，其中 8 颗具备 JWST 衍射星芒)
        for (let i = 0; i < 50; i++) {
          const isSpikeStar = i < 8; // 保证前 8 颗拥有清晰耀眼的太空望远镜十字星芒
          this.stars.push({
            layer: 1,
            x: Math.random() * w,
            y: Math.random() * h,
            size: isSpikeStar ? Math.random() * 0.6 + 1.6 : Math.random() * 0.7 + 1.0,
            baseAlpha: Math.random() * 0.35 + 0.65,
            twinkleSpeed: Math.random() * 0.025 + 0.015,
            twinklePhase: Math.random() * Math.PI * 2,
            speedX: (Math.random() - 0.5) * 0.14,
            speedY: (Math.random() - 0.5) * 0.14,
            hasSpike: isSpikeStar,
            spikeLen: Math.random() * 10 + 12,
            colorType: Math.random() > 0.4 ? 'accent' : 'white'
          });
        }

        // Layer 2: 前景漂浮失焦星际微尘 (18 颗，3.2~6.0px，高视差，柔和光斑)
        for (let i = 0; i < 18; i++) {
          this.stars.push({
            layer: 2,
            x: Math.random() * w,
            y: Math.random() * h,
            size: Math.random() * 2.8 + 3.2,
            baseAlpha: Math.random() * 0.16 + 0.10,
            twinkleSpeed: Math.random() * 0.018 + 0.008,
            twinklePhase: Math.random() * Math.PI * 2,
            speedX: (Math.random() - 0.5) * 0.24,
            speedY: (Math.random() - 0.5) * 0.24,
            hasSpike: false,
            colorType: 'glow'
          });
        }

        // 4. 初始化主角卡片周围漂浮的星际余烬 (Cosmic Embers: 32 颗温润上浮微粒)
        this.embers = [];
        for (let i = 0; i < 32; i++) {
          this.embers.push({
            x: w * (0.16 + Math.random() * 0.42),
            y: h * (0.20 + Math.random() * 0.75),
            size: Math.random() * 1.5 + 1.0,
            speedY: Math.random() * 0.6 + 0.35,
            wobbleSpeed: Math.random() * 0.03 + 0.015,
            wobbleAmp: Math.random() * 0.8 + 0.4,
            wobblePhase: Math.random() * Math.PI * 2,
            baseAlpha: Math.random() * 0.45 + 0.40,
            pulseSpeed: Math.random() * 0.04 + 0.02,
            pulsePhase: Math.random() * Math.PI * 2,
            isCore: Math.random() > 0.65
          });
        }
      }

      setTheme(newTheme) {
        this.theme = newTheme;
      }

      bindEvents() {
        window.addEventListener('resize', () => {
          this.initCanvas();
          this.initCosmicElements();
        });
        window.addEventListener('mousemove', (e) => {
          this.mouseX = e.clientX;
          this.mouseY = e.clientY;
        });
      }

      // 1. 绘制底层电离星云暗涌 (提升丰满度与深空色彩层次)
      drawCosmicNebula() {
        const ctx = this.ctx;
        const w = this.width;
        const h = this.height;

        ctx.save();
        this.nebulae.forEach((neb, idx) => {
          const offsetX = Math.sin(this.time * neb.driftSpeed * 60 + neb.driftPhase) * neb.driftRadius;
          const offsetY = Math.cos(this.time * neb.driftSpeed * 50 + neb.driftPhase) * neb.driftRadius;
          const cx = neb.baseX * w + offsetX;
          const cy = neb.baseY * h + offsetY;
          const radius = Math.max(w, h) * neb.radiusRatio;

          const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
          const innerColor = (idx % 2 === 0) 
            ? this.getAlphaColor(this.theme.accentHex, neb.alpha) 
            : this.getAlphaColor(this.theme.glowRgba, neb.alpha * 0.8);
          const midColor = this.getAlphaColor(this.theme.glowRgba, neb.alpha * 0.4);

          grad.addColorStop(0, innerColor);
          grad.addColorStop(0.48, midColor);
          grad.addColorStop(1, 'transparent');

          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(cx, cy, radius, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.restore();
      }

      // 2. 方案 A 核心：绘制主角卡片后方「能量场舞台背光（Hero Stage Aura）」
      drawHeroStageAura() {
        const ctx = this.ctx;
        const w = this.width;
        const h = this.height;

        // 主角卡片背光中心 (位于屏幕偏左侧 35% 处，对应 3D 展台主角卡片)
        const mouseOffX = (this.smoothMouseX - w / 2) * 0.025;
        const mouseOffY = (this.smoothMouseY - h / 2) * 0.025;
        const heroX = w * 0.35 + mouseOffX;
        const heroY = h * 0.50 + mouseOffY;

        // 柔和呼吸脉冲
        const pulse = Math.sin(this.time * 1.5) * 25;
        const coreRadius = Math.min(w, h) * 0.42 + pulse;

        ctx.save();
        // 主光晕：大范围多层径向柔光背晕，直接映衬卡片轮廓，产生强烈的立体悬浮感
        const heroGrad = ctx.createRadialGradient(heroX, heroY, 30, heroX, heroY, coreRadius);
        heroGrad.addColorStop(0, this.getAlphaColor(this.theme.accentHex, 0.32));
        heroGrad.addColorStop(0.35, this.getAlphaColor(this.theme.glowRgba, 0.18));
        heroGrad.addColorStop(0.70, this.getAlphaColor(this.theme.glowRgba, 0.06));
        heroGrad.addColorStop(1, 'transparent');

        ctx.fillStyle = heroGrad;
        ctx.beginPath();
        ctx.arc(heroX, heroY, coreRadius, 0, Math.PI * 2);
        ctx.fill();

        // 右侧文字标题辅助光晕 (提升右侧 40% 排版通透感)
        const textX = w * 0.68 + mouseOffX * 0.5;
        const textY = h * 0.48 + mouseOffY * 0.5;
        const textRadius = Math.min(w, h) * 0.32;
        const textGrad = ctx.createRadialGradient(textX, textY, 20, textX, textY, textRadius);
        textGrad.addColorStop(0, this.getAlphaColor(this.theme.glowRgba, 0.15));
        textGrad.addColorStop(0.55, this.getAlphaColor(this.theme.glowRgba, 0.04));
        textGrad.addColorStop(1, 'transparent');

        ctx.fillStyle = textGrad;
        ctx.beginPath();
        ctx.arc(textX, textY, textRadius, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      // 3. 方案 A 核心：绘制横贯深空的「流动极光/能量光带（Cosmic Aurora Ribbons）」
      drawAuroraRibbons() {
        const ctx = this.ctx;
        const w = this.width;
        const h = this.height;

        ctx.save();
        // 使用 screen 混合模式实现极光丝绸般的光华叠加
        ctx.globalCompositeOperation = 'screen';

        this.auroraRibbons.forEach((ribbon) => {
          const t = this.time * ribbon.speed * 60;
          const points = [];
          const step = w / 22;

          // 上边缘曲线
          for (let x = -50; x <= w + 50; x += step) {
            const wave1 = Math.sin(x * ribbon.freq1 + t + ribbon.phase1) * ribbon.amp1;
            const wave2 = Math.cos(x * ribbon.freq2 - t * 0.7 + ribbon.phase2) * ribbon.amp2;
            const y = ribbon.baseY * h + wave1 + wave2;
            points.push({ x, y });
          }

          // 渐变填充光带
          const grad = ctx.createLinearGradient(0, ribbon.baseY * h - 70, 0, ribbon.baseY * h + ribbon.thickness + 70);
          grad.addColorStop(0, 'transparent');
          grad.addColorStop(0.35, this.getAlphaColor(this.theme.accentHex, ribbon.alpha));
          grad.addColorStop(0.65, this.getAlphaColor(this.theme.glowRgba, ribbon.alpha * 0.75));
          grad.addColorStop(1, 'transparent');

          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.moveTo(points[0].x, points[0].y);
          for (let i = 1; i < points.length; i++) {
            const prev = points[i - 1];
            const curr = points[i];
            const cx = (prev.x + curr.x) / 2;
            const cy = (prev.y + curr.y) / 2;
            ctx.quadraticCurveTo(prev.x, prev.y, cx, cy);
          }
          ctx.lineTo(points[points.length - 1].x, points[points.length - 1].y);

          // 闭合至下边缘波形
          for (let i = points.length - 1; i >= 0; i--) {
            const p = points[i];
            const bottomY = p.y + ribbon.thickness + Math.sin(p.x * 0.004 + t) * 22;
            if (i === points.length - 1) {
              ctx.lineTo(p.x, bottomY);
            } else {
              const prev = points[i + 1];
              const prevBottomY = prev.y + ribbon.thickness + Math.sin(prev.x * 0.004 + t) * 22;
              const cx = (prev.x + p.x) / 2;
              const cy = (prevBottomY + bottomY) / 2;
              ctx.quadraticCurveTo(prev.x, prevBottomY, cx, cy);
            }
          }
          ctx.closePath();
          ctx.fill();
        });

        ctx.restore();
      }

      // 4. 方案 A 核心：绘制主角卡片周围的「漂浮星际余烬（Cosmic Embers）」
      drawCosmicEmbers() {
        const ctx = this.ctx;
        const w = this.width;
        const h = this.height;

        ctx.save();
        this.embers.forEach(p => {
          p.y -= p.speedY;
          p.x += Math.sin(this.time * p.wobbleSpeed * 60 + p.wobblePhase) * p.wobbleAmp;

          // 越过顶部时重置至卡片底部区域
          if (p.y < h * 0.16) {
            p.y = h * 0.88 + Math.random() * (h * 0.1);
            p.x = w * (0.16 + Math.random() * 0.42);
          }

          const currentAlpha = p.baseAlpha * (0.6 + 0.4 * Math.sin(this.time * p.pulseSpeed * 60 + p.pulsePhase));
          
          ctx.fillStyle = p.isCore ? '#ffffff' : this.getAlphaColor(this.theme.accentHex, currentAlpha);
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();

          // 微光温润外晕
          if (p.size > 1.2) {
            ctx.fillStyle = this.getAlphaColor(this.theme.glowRgba, currentAlpha * 0.55);
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * 2.8, 0, Math.PI * 2);
            ctx.fill();
          }
        });
        ctx.restore();
      }

      // 5. 绘制时空曲率与引力天球网格 (保留右下角透视构图，线条更加通透饱满)
      drawSpacetimeGrid() {
        const ctx = this.ctx;
        const w = this.width;
        const h = this.height;

        const originX = w * 0.95;
        const originY = h * 0.60;
        const gridW = w * 0.50;

        ctx.save();
        ctx.strokeStyle = this.theme.gridRgba;
        ctx.lineWidth = 1;

        const rayCount = 10;
        const rayPoints = [];

        // A. 纵向引力波辐射线 (加入细微正弦时空曲率波动)
        for (let i = 0; i <= rayCount; i++) {
          const t = i / rayCount;
          const startX = originX - gridW * (1 - t * 0.28);
          const startY = h;
          const endX = originX + t * 45;
          const endY = originY;

          const steps = 14;
          ctx.beginPath();
          const pts = [];
          for (let s = 0; s <= steps; s++) {
            const progress = s / steps;
            const px = startX + (endX - startX) * progress;
            const py = startY + (endY - startY) * progress;
            const wave = Math.sin(progress * 6 - this.time * 0.5 + i * 0.4) * 3.5 * (1 - progress);
            const curvedX = px + wave;
            pts.push({ x: curvedX, y: py });
            if (s === 0) {
              ctx.moveTo(curvedX, py);
            } else {
              ctx.lineTo(curvedX, py);
            }
          }
          rayPoints.push(pts);
          ctx.stroke();
        }

        // B. 弧形时空测地线 (由密到疏，平缓的引力下陷)
        const horizCount = 8;
        for (let j = 1; j <= horizCount; j++) {
          const progress = Math.pow(j / horizCount, 2);
          const currentY = originY + (h - originY) * progress;
          const currentXStart = originX - gridW * progress;

          ctx.beginPath();
          const hSteps = 16;
          for (let hs = 0; hs <= hSteps; hs++) {
            const hProg = hs / hSteps;
            const hx = currentXStart + (w - currentXStart) * hProg;
            const sag = Math.sin(hProg * Math.PI) * (14 * progress);
            const hy = currentY + sag;
            if (hs === 0) {
              ctx.moveTo(hx, hy);
            } else {
              ctx.lineTo(hx, hy);
            }
          }
          ctx.stroke();
        }

        // C. 沿坐标线流转滑行的射电探测脉冲 (Telemetry Packets)
        this.gridPulses.forEach(pulse => {
          pulse.progress += pulse.speed;
          if (pulse.progress > 1) {
            pulse.progress = 0;
            pulse.rayIdx = Math.floor(Math.random() * rayPoints.length);
          }
          const pts = rayPoints[pulse.rayIdx];
          if (pts && pts.length > 0) {
            const sampleIdx = Math.min(Math.floor(pulse.progress * (pts.length - 1)), pts.length - 1);
            const pt = pts[sampleIdx];
            if (pt) {
              // 脉冲发光核心
              ctx.fillStyle = '#ffffff';
              ctx.beginPath();
              ctx.arc(pt.x, pt.y, 2.2, 0, Math.PI * 2);
              ctx.fill();

              // 脉冲外晕
              ctx.fillStyle = this.getAlphaColor(this.theme.glowRgba, 0.55);
              ctx.beginPath();
              ctx.arc(pt.x, pt.y, 7.0, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        });

        // D. 引力中心原点处的微型天体光核
        const originGlow = ctx.createRadialGradient(originX, originY, 1, originX, originY, 26);
        originGlow.addColorStop(0, '#ffffff');
        originGlow.addColorStop(0.35, this.theme.accentHex || '#38bdf8');
        originGlow.addColorStop(1, 'transparent');
        ctx.fillStyle = originGlow;
        ctx.beginPath();
        ctx.arc(originX, originY, 26, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      // 6. 绘制偶发深空微流星 (Meteor Streaks)
      drawMeteors() {
        const ctx = this.ctx;
        const now = this.time;

        if (now > this.nextMeteorTime && this.meteors.length === 0) {
          const startX = this.width * (0.30 + Math.random() * 0.60);
          const startY = this.height * (0.02 + Math.random() * 0.18);
          const angle = Math.PI * (0.75 + (Math.random() - 0.5) * 0.12);
          const speed = Math.random() * 9 + 15;
          const length = Math.random() * 95 + 115;

          this.meteors.push({
            x: startX,
            y: startY,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            length: length,
            life: 1.0,
            decay: Math.random() * 0.022 + 0.026
          });

          this.nextMeteorTime = now + (11 + Math.random() * 9);
        }

        for (let i = this.meteors.length - 1; i >= 0; i--) {
          const m = this.meteors[i];
          m.x += m.vx;
          m.y += m.vy;
          m.life -= m.decay;

          if (m.life <= 0 || m.x < -100 || m.y > this.height + 100) {
            this.meteors.splice(i, 1);
            continue;
          }

          const speedDist = Math.hypot(m.vx, m.vy);
          const tailX = m.x - (m.vx / speedDist) * m.length;
          const tailY = m.y - (m.vy / speedDist) * m.length;

          const grad = ctx.createLinearGradient(m.x, m.y, tailX, tailY);
          grad.addColorStop(0, `rgba(255, 255, 255, ${m.life})`);
          grad.addColorStop(0.35, this.getAlphaColor(this.theme.accentHex, m.life * 0.9));
          grad.addColorStop(1, 'transparent');

          ctx.save();
          ctx.strokeStyle = grad;
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.moveTo(m.x, m.y);
          ctx.lineTo(tailX, tailY);
          ctx.stroke();

          ctx.fillStyle = `rgba(255, 255, 255, ${m.life})`;
          ctx.beginPath();
          ctx.arc(m.x, m.y, 2.0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      // 7. 绘制密集三维景深星海与显眼 JWST 十字星芒
      drawDeepSpaceStarfield() {
        const ctx = this.ctx;
        const w = this.width;
        const h = this.height;

        this.smoothMouseX += (this.mouseX - this.smoothMouseX) * 0.05;
        this.smoothMouseY += (this.mouseY - this.smoothMouseY) * 0.05;
        const mouseNormX = (this.smoothMouseX - w / 2);
        const mouseNormY = (this.smoothMouseY - h / 2);

        this.stars.forEach(s => {
          s.x += s.speedX;
          s.y += s.speedY;

          if (s.x < 0) s.x = w;
          if (s.x > w) s.x = 0;
          if (s.y < 0) s.y = h;
          if (s.y > h) s.y = 0;

          let parallaxFactor = 0.008;
          if (s.layer === 1) parallaxFactor = 0.022;
          if (s.layer === 2) parallaxFactor = 0.055;

          const drawX = s.x + mouseNormX * parallaxFactor;
          const drawY = s.y + mouseNormY * parallaxFactor;

          const twinkle = 0.7 + 0.3 * Math.sin(this.time * s.twinkleSpeed * 50 + s.twinklePhase);
          const currentAlpha = s.baseAlpha * twinkle;

          // A. 远景微星 (密集细腻)
          if (s.layer === 0) {
            ctx.fillStyle = s.colorType === 'accent' ? (this.theme.accentHex || '#38bdf8') : '#ffffff';
            ctx.globalAlpha = currentAlpha;
            ctx.beginPath();
            ctx.arc(drawX, drawY, s.size, 0, Math.PI * 2);
            ctx.fill();
          }

          // B. 中景主序恒星 (带清晰光晕与 JWST 十字/六芒衍射星芒)
          else if (s.layer === 1) {
            ctx.globalAlpha = currentAlpha;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(drawX, drawY, s.size, 0, Math.PI * 2);
            ctx.fill();

            // 恒星饱满柔光晕
            ctx.fillStyle = this.getAlphaColor(this.theme.glowRgba, currentAlpha * 0.65);
            ctx.beginPath();
            ctx.arc(drawX, drawY, s.size * 3.0, 0, Math.PI * 2);
            ctx.fill();

            // JWST 十字微光芒 (增加视觉穿透力)
            if (s.hasSpike) {
              const spLen = s.spikeLen * (0.85 + 0.15 * Math.sin(this.time * 2.2 + s.twinklePhase));
              ctx.strokeStyle = `rgba(255, 255, 255, ${currentAlpha * 0.55})`;
              ctx.lineWidth = 0.85;
              ctx.beginPath();
              // 主十字轴
              ctx.moveTo(drawX - spLen, drawY);
              ctx.lineTo(drawX + spLen, drawY);
              ctx.moveTo(drawX, drawY - spLen);
              ctx.lineTo(drawX, drawY + spLen);
              // 次级 45 度微光芒
              const diagLen = spLen * 0.38;
              ctx.moveTo(drawX - diagLen, drawY - diagLen);
              ctx.lineTo(drawX + diagLen, drawY + diagLen);
              ctx.moveTo(drawX - diagLen, drawY + diagLen);
              ctx.lineTo(drawX + diagLen, drawY - diagLen);
              ctx.stroke();
            }
          }

          // C. 前景失焦星际微尘 (虚化大光斑 Bokeh)
          else if (s.layer === 2) {
            const bokehGrad = ctx.createRadialGradient(drawX, drawY, 0, drawX, drawY, s.size);
            bokehGrad.addColorStop(0, this.getAlphaColor(this.theme.glowRgba, currentAlpha));
            bokehGrad.addColorStop(0.6, this.getAlphaColor(this.theme.glowRgba, currentAlpha * 0.35));
            bokehGrad.addColorStop(1, 'transparent');
            ctx.globalAlpha = 1.0;
            ctx.fillStyle = bokehGrad;
            ctx.beginPath();
            ctx.arc(drawX, drawY, s.size, 0, Math.PI * 2);
            ctx.fill();
          }
        });

        ctx.globalAlpha = 1.0;
      }

      animate() {
        this.time += 0.035;
        this.ctx.clearRect(0, 0, this.width, this.height);

        // 1. 绘制底层电离星云暗涌
        this.drawCosmicNebula();
        // 2. 方案 A：绘制主角卡片背光与舞台氛围光晕
        this.drawHeroStageAura();
        // 3. 方案 A：绘制横贯深空的流动极光光带
        this.drawAuroraRibbons();
        // 4. 绘制时空曲率与引力天球网格
        this.drawSpacetimeGrid();
        // 5. 绘制密集三维景深星海与 JWST 星芒
        this.drawDeepSpaceStarfield();
        // 6. 方案 A：绘制主角卡片周边的漂浮星际余烬
        this.drawCosmicEmbers();
        // 7. 绘制偶发深空微流星
        this.drawMeteors();

        requestAnimationFrame(() => this.animate());
      }
    }

    // ----------------------------------------------------
    // C. Web Audio API 沉浸式环境音频合成器
    // ----------------------------------------------------
    class AmbientAudioEngine {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.isPlaying = false;
        this.currentNodes = [];
        this.baseFreq = 55;
        this.userMuted = true;
      }

      initContext() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
          this.masterGain = this.ctx.createGain();
          this.masterGain.gain.setValueAtTime(0, this.ctx.currentTime);
          this.masterGain.connect(this.ctx.destination);
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playTheme(freq = 55) {
        this.initContext();
        this.baseFreq = freq;
        this.stopCurrent();

        const now = this.ctx.currentTime;
        const osc1 = this.ctx.createOscillator();
        const gain1 = this.ctx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(freq, now);
        gain1.gain.setValueAtTime(0.18, now);
        osc1.connect(gain1);
        gain1.connect(this.masterGain);
        osc1.start();
        this.currentNodes.push(osc1, gain1);

        const osc2 = this.ctx.createOscillator();
        const gain2 = this.ctx.createGain();
        osc2.type = 'triangle';
        osc2.frequency.setValueAtTime(freq * 1.5 + 0.8, now);
        gain2.gain.setValueAtTime(0.06, now);
        osc2.connect(gain2);
        gain2.connect(this.masterGain);
        osc2.start();
        this.currentNodes.push(osc2, gain2);

        if (!this.userMuted) {
          this.fadeIn(1.2);
          this.isPlaying = true;
        }
      }

      stopCurrent() {
        if (!this.ctx) return;
        this.currentNodes.forEach(node => {
          try {
            if (node.stop) node.stop();
            node.disconnect();
          } catch(e) {}
        });
        this.currentNodes = [];
      }

      fadeIn(duration = 1.0) {
        if (!this.ctx || this.userMuted) return;
        const now = this.ctx.currentTime;
        this.masterGain.gain.cancelScheduledValues(now);
        this.masterGain.gain.setValueAtTime(this.masterGain.gain.value, now);
        this.masterGain.gain.linearRampToValueAtTime(0.35, now + duration);
        this.isPlaying = true;
      }

      fadeOut(duration = 0.8) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        this.masterGain.gain.cancelScheduledValues(now);
        this.masterGain.gain.setValueAtTime(this.masterGain.gain.value, now);
        this.masterGain.gain.linearRampToValueAtTime(0, now + duration);
        this.isPlaying = false;
      }

      toggle() {
        this.initContext();
        this.userMuted = !this.userMuted;
        if (this.userMuted) {
          this.fadeOut(0.6);
        } else {
          this.playTheme(this.baseFreq);
          this.fadeIn(0.8);
        }
        return !this.userMuted;
      }
    }

    // 前进：点击主页卡片 -> 卡片 3D 升空蜕变至 3D 展台主角
    function triggerSpatialMorphForward(callback) {
      if (isTransitioning) {
        if (callback) callback();
        return;
      }
      isTransitioning = true;

      // 1. 定位源卡片
      let sourceCard = lastClickedCard;
      if (!sourceCard || !document.body.contains(sourceCard)) {
        if (currentSeries) {
          sourceCard = document.querySelector(`.home-card[data-id="${currentSeries.id}"]`);
        }
      }

      // 降级兜底切换
      if (!sourceCard) {
        viewHome.classList.remove('current');
        viewStage.classList.add('current');
        if (callback) callback();
        isTransitioning = false;
        return;
      }

      const startRect = sourceCard.getBoundingClientRect();
      const imgEl = sourceCard.querySelector('.home-card-img');
      const imgSrc = imgEl ? imgEl.src : (currentSeries ? currentSeries.cover_thumb : '');

      // 2. 主页其他卡片优雅退后景深虚化，源卡片占位隐形
      document.querySelectorAll('.home-card').forEach(c => {
        if (c !== sourceCard) {
          c.classList.add('receding');
        }
      });
      sourceCard.style.opacity = '0';

      // 3. 创建 3D 飞行代理卡片 (Morph Hero Proxy)
      const proxy = document.createElement('div');
      proxy.className = 'morph-flight-proxy';
      proxy.style.left = `${startRect.left}px`;
      proxy.style.top = `${startRect.top}px`;
      proxy.style.width = `${startRect.width}px`;
      proxy.style.height = `${startRect.height}px`;
      proxy.style.borderRadius = '14px';
      proxy.innerHTML = `
        <img src="${imgSrc}" alt="" />
        <div class="morph-flight-glare"></div>
      `;
      document.body.appendChild(proxy);

      // 4. 准备展台视图与 DOM 初始化
      viewStage.style.display = 'block';
      viewStage.style.position = 'fixed';
      viewStage.style.inset = '0';
      viewStage.style.zIndex = '60';
      viewStage.style.opacity = '0';
      viewStage.style.transition = 'opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1)';

      const stageInfo = document.getElementById('stageInfoContent');
      if (stageInfo) {
        stageInfo.style.transform = 'translateY(40px)';
        stageInfo.style.opacity = '0';
        stageInfo.style.transition = 'transform 0.85s cubic-bezier(0.16, 1, 0.3, 1) 0.1s, opacity 0.85s ease 0.1s';
      }

      // 执行外部数据初始化 (渲染 3D 轮转展台)
      if (callback) callback();

      // 暂时隐藏主角卡片，待飞行代理就位后无缝接管
      const targetCard = (typeof stage3DController !== 'undefined' && stage3DController.cardElements) ? stage3DController.cardElements[0] : null;
      if (targetCard) {
        targetCard.style.opacity = '0';
      }

      // 获取展台主角卡片目标坐标
      let targetRect = null;
      if (targetCard) {
        const r = targetCard.getBoundingClientRect();
        if (r.width > 0 && r.height > 0) {
          targetRect = r;
        }
      }
      if (!targetRect) {
        const left = Math.round(window.innerWidth * 0.36 - 180);
        const top = Math.round(window.innerHeight * 0.52 - 255);
        targetRect = { left: Math.max(left, 40), top: Math.max(top, 60), width: 360, height: 510 };
      }

      // 5. 下一帧触发空间飞行蜕变
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          // 主页整体微缩淡出
          viewHome.style.transition = 'opacity 0.6s ease, transform 0.82s cubic-bezier(0.16, 1, 0.3, 1)';
          viewHome.style.opacity = '0';
          viewHome.style.transform = 'scale(0.96)';

          // 展台渐入并推升图文
          viewStage.style.opacity = '1';
          if (stageInfo) {
            stageInfo.style.transform = 'translateY(0)';
            stageInfo.style.opacity = '1';
          }

          // 代理卡片在 3D 空间中飞升与微倾
          proxy.style.left = `${targetRect.left}px`;
          proxy.style.top = `${targetRect.top}px`;
          proxy.style.width = `${targetRect.width}px`;
          proxy.style.height = `${targetRect.height}px`;
          proxy.style.borderRadius = '18px';
          proxy.style.transform = 'translateZ(60px) rotateY(-4deg)';
        });
      });

      // 6. 飞行合体交接完成 (840ms)
      setTimeout(() => {
        if (targetCard) {
          targetCard.style.opacity = '';
        }
        proxy.remove();

        viewHome.classList.remove('current');
        viewHome.style.display = '';
        viewHome.style.opacity = '';
        viewHome.style.transform = '';
        viewHome.style.transition = '';

        document.querySelectorAll('.home-card').forEach(c => {
          c.classList.remove('receding');
          c.style.opacity = '';
        });

        viewStage.classList.add('current');
        viewStage.style.display = '';
        viewStage.style.position = '';
        viewStage.style.inset = '';
        viewStage.style.zIndex = '';
        viewStage.style.opacity = '';
        viewStage.style.transition = '';

        if (stageInfo) {
          stageInfo.style.transform = '';
          stageInfo.style.opacity = '';
          stageInfo.style.transition = '';
        }

        isTransitioning = false;
        lastClickedCard = null;
      }, 840);
    }

    // ========================================================
    // HuyML 风格 3D 轴向无限循环流转引擎 (Infinite 3D Stream Carousel)
    // ========================================================
    class Stage3DStreamController {
      constructor() {
        this.container = document.getElementById('stageStreamArea');
        this.deck = document.getElementById('stageCardsDeck');
        this.infoArea = document.getElementById('stageInfoContent');
        this.cardElements = [];
        this.currentScroll = 0;
        this.targetScroll = 0;
        this.activeIdx = 0;
        this.isAnimating = false;
        this.snapTimer = null;
        this.isDragging = false;
        this.dragStartY = 0;
        this.dragStartScroll = 0;
        this.hasMoved = false;

        this.bindEvents();
      }

      bindEvents() {
        // 滚轮控制平滑滚动：整个展台区域任意位置均可响应滚轮
        const stageViewEl = document.getElementById('viewStage');
        const wheelTarget = stageViewEl || this.container;

        wheelTarget.addEventListener('wheel', (e) => {
          if (currentView !== 'stage') return;
          e.preventDefault();
          const delta = Math.sign(e.deltaY) * Math.min(Math.abs(e.deltaY), 80);
          this.targetScroll += delta * 0.0035;
          this.scheduleSnap();
        }, { passive: false });

        // 触控与鼠标拖拽
        const onPointerDown = (e) => {
          if (currentView !== 'stage') return;
          if (e.target.closest('button') || e.target.closest('a') || e.target.closest('.photo-modal-view')) return;
          this.isDragging = true;
          this.hasMoved = false;
          this.dragStartY = e.clientY || (e.touches && e.touches[0].clientY) || 0;
          this.dragStartScroll = this.targetScroll;
        };

        const onPointerMove = (e) => {
          if (!this.isDragging) return;
          const clientY = e.clientY || (e.touches && e.touches[0].clientY) || 0;
          const diff = this.dragStartY - clientY;
          if (Math.abs(diff) > 4) {
            this.hasMoved = true;
          }
          this.targetScroll = this.dragStartScroll + diff * 0.0035;
        };

        const onPointerUp = () => {
          if (!this.isDragging) return;
          this.isDragging = false;
          this.scheduleSnap();
        };

        wheelTarget.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);

        wheelTarget.addEventListener('touchstart', onPointerDown, { passive: true });
        window.addEventListener('touchmove', onPointerMove, { passive: true });
        window.addEventListener('touchend', onPointerUp);
      }

      scheduleSnap() {
        clearTimeout(this.snapTimer);
        this.snapTimer = setTimeout(() => {
          this.targetScroll = Math.round(this.targetScroll);
        }, 120);
      }

      init(images) {
        this.images = images || [];
        this.count = this.images.length;
        this.deck.innerHTML = '';
        this.cardElements = [];
        this.currentScroll = 0;
        this.targetScroll = 0;
        this.activeIdx = 0;

        if (this.count === 0) return;

        // 创建每个卡片 DOM
        this.images.forEach((img, i) => {
          const card = document.createElement('div');
          card.className = 'deck-card-item';
          card.dataset.index = i;
          
          card.innerHTML = `
            <div class="deck-card-tag" id="cardTag_${i}">P${i + 1}</div>
            <div class="deck-card-media">
              <img class="deck-card-img" src="${img.url}" alt="${escapeHtml(img.name)}" loading="lazy" />
            </div>
          `;

          // 鼠标悬停弹性拉扯反馈
          card.addEventListener('mouseenter', () => {
            card.dataset.hovered = 'true';
          });
          card.addEventListener('mouseleave', () => {
            card.dataset.hovered = 'false';
          });

          // 点击事件：聚焦点卡片打开全屏大图，背景卡片点击旋转至主位
          card.addEventListener('click', (e) => {
            if (this.hasMoved) return; // 拖拽中不触发点击
            const currentDiff = this.getCardRelativePos(i);
            if (Math.abs(currentDiff) < 0.45) {
              // 当前主角卡片
              openPhotoModal(i);
            } else {
              // 背景队列卡片，点击顺滑滑行至主角位
              this.targetScroll += Math.round(currentDiff);
              this.scheduleSnap();
            }
          });

          this.deck.appendChild(card);
          this.cardElements.push(card);
        });

        if (!this.isAnimating) {
          this.isAnimating = true;
          this.loop();
        }

        // 初始化更新右侧文本
        this.updateEditorial(0);
      }

      getCardRelativePos(index) {
        const N = this.count;
        if (N === 0) return 0;
        let diff = (index - this.currentScroll) % N;
        while (diff < -1.5) diff += N;
        while (diff >= N - 1.5) diff -= N;
        return diff;
      }

      interpolateKeyframes(p) {
        // 严格遵循用户手绘草图与 huyml.co：
        // 1. 舞台沿单一 3D 对角线矢量贯穿整个视口 (左下到右上)
        // 2. 主角卡片 (p=0) 位于中偏左 (x:0.36, y:0.52)，紧邻右侧文本 (left:49vw)，距离拉近至 40~60px
        // 3. 主角卡片与上一个图片 (p=-1)、等待队列 (p=1) 之间拉开显著巨大间距 (Δu=0.50)，彻底孤立突出主角
        // 4. 等待队列 (p>=1) 位于右上角背景深景深处，卡片之间间距紧密有序 (Δu=0.12~0.20)，层叠浮于文字上方深处
        const kfs = [
          { p: -1.4, x: -0.09, y: 0.95, z: 160,  s: 0.65, rx: 0,  ry: 3,  rz: -12, op: 0.0, br: 0.5 },
          { p: -1.0, x: 0.05,  y: 0.81, z: 100,  s: 0.78, rx: 4,  ry: 7,  rz: -9,  op: 0.45,br: 0.75 },
          { p: -0.5, x: 0.20,  y: 0.66, z: 70,   s: 0.96, rx: 6,  ry: 10, rz: -6,  op: 0.85,br: 0.90 },
          { p: 0.0,  x: 0.35,  y: 0.52, z: 40,   s: 1.15, rx: 8,  ry: 12, rz: -4,  op: 1.0, br: 1.0 },
          { p: 0.5,  x: 0.53,  y: 0.35, z: -70,  s: 0.88, rx: 11, ry: 14, rz: -3,  op: 0.90,br: 0.90 },
          { p: 1.0,  x: 0.72,  y: 0.18, z: -180, s: 0.60, rx: 14, ry: 16, rz: -2,  op: 0.80,br: 0.80 },
          { p: 2.0,  x: 0.81,  y: 0.11, z: -300, s: 0.48, rx: 17, ry: 18, rz: 1,   op: 0.65,br: 0.68 },
          { p: 3.0,  x: 0.88,  y: 0.06, z: -420, s: 0.36, rx: 20, ry: 21, rz: 4,   op: 0.45,br: 0.52 },
          { p: 4.0,  x: 0.94,  y: 0.01, z: -540, s: 0.26, rx: 23, ry: 24, rz: 7,   op: 0.18,br: 0.40 },
          { p: 4.8,  x: 0.98,  y: -0.02,z: -660, s: 0.18, rx: 25, ry: 26, rz: 9,   op: 0.0, br: 0.25 }
        ];

        if (p <= kfs[0].p) return kfs[0];
        if (p >= kfs[kfs.length - 1].p) return kfs[kfs.length - 1];

        for (let i = 0; i < kfs.length - 1; i++) {
          const k1 = kfs[i];
          const k2 = kfs[i + 1];
          if (k1.p <= p && p <= k2.p) {
            const t = (p - k1.p) / (k2.p - k1.p);
            return {
              x: k1.x + (k2.x - k1.x) * t,
              y: k1.y + (k2.y - k1.y) * t,
              z: k1.z + (k2.z - k1.z) * t,
              s: k1.s + (k2.s - k1.s) * t,
              rx: k1.rx + (k2.rx - k1.rx) * t,
              ry: k1.ry + (k2.ry - k1.ry) * t,
              rz: k1.rz + (k2.rz - k1.rz) * t,
              op: k1.op + (k2.op - k1.op) * t,
              br: k1.br + (k2.br - k1.br) * t
            };
          }
        }
        return kfs[3];
      }

      loop() {
        if (!currentSeries || currentView !== 'stage') {
          this.isAnimating = false;
          return;
        }

        // 物理平滑缓动 Lerp
        this.currentScroll += (this.targetScroll - this.currentScroll) * 0.09;

        const cw = window.innerWidth;
        const ch = window.innerHeight;

        const N = this.count;
        const normalizedActive = ((Math.round(this.currentScroll) % N) + N) % N;

        if (normalizedActive !== this.activeIdx) {
          this.activeIdx = normalizedActive;
          this.updateEditorial(this.activeIdx);
        }

        // 渲染每张卡片
        this.cardElements.forEach((card, i) => {
          let p = (i - this.currentScroll) % N;
          while (p < -1.5) p += N;
          while (p >= N - 1.5) p -= N;

          // 距离视野外直接隐藏优化性能
          if (p < -1.4 || p > 4.8) {
            card.style.display = 'none';
            return;
          }
          card.style.display = 'block';

          const trans = this.interpolateKeyframes(p);
          const isHovered = card.dataset.hovered === 'true';

          // 卡片中心像素计算
          let pixelX = trans.x * cw - 180; // 减去卡片半宽 360/2
          let pixelY = trans.y * ch - 255; // 减去卡片半高 510/2
          let scale = trans.s;
          let translateZ = trans.z;
          let rotateX = trans.rx;
          let rotateY = trans.ry;
          let rotateZ = trans.rz;

          // 悬停弹性向外拉扯效果
          if (isHovered) {
            pixelX -= 25;
            pixelY -= 25;
            translateZ += 40;
            scale *= 1.05;
          }

          // 动态标签更新：每张卡片保持其专属编号 P1, P2, P3...
          const tagEl = document.getElementById(`cardTag_${i}`);
          if (tagEl) {
            tagEl.textContent = `P${i + 1}`;
            tagEl.style.opacity = Math.max(0, trans.op);
          }

          card.style.transform = `translate3d(${pixelX.toFixed(1)}px, ${pixelY.toFixed(1)}px, ${translateZ.toFixed(1)}px) scale(${scale.toFixed(3)}) rotateX(${rotateX.toFixed(1)}deg) rotateY(${rotateY.toFixed(1)}deg) rotateZ(${rotateZ.toFixed(1)}deg)`;
          card.style.opacity = trans.op.toFixed(3);
          card.style.filter = `brightness(${trans.br.toFixed(2)})`;

          let zIdx = 10;
          if (Math.abs(p) < 0.5) {
            zIdx = 35; // 主角卡片在最前层
          } else if (p < 0) {
            zIdx = 20; // 正在退出的卡片
          } else {
            zIdx = Math.max(1, Math.round(18 - p * 3)); // 队列中的卡片在深层 (15, 12, 9...)，位于文字(z-index: 25)后方
          }
          card.style.zIndex = zIdx;

          if (Math.abs(p) < 0.4) {
            card.classList.add('is-active');
          } else {
            card.classList.remove('is-active');
          }
        });

        requestAnimationFrame(() => this.loop());
      }

      updateEditorial(activeImgIndex) {
        if (!currentSeries || !currentSeries.images[activeImgIndex]) return;
        const img = currentSeries.images[activeImgIndex];
        const total = currentSeries.count;
        const padNum = String(activeImgIndex + 1).padStart(2, '0');
        const padTotal = String(total).padStart(2, '0');

        // 更新导航右上角计数器
        navRefCounter.innerHTML = `${padNum} <span>/ ${padTotal}</span>`;

        // 微过渡淡入淡出动画
        this.infoArea.classList.add('updating');
        setTimeout(() => {
          stageTitleZh.textContent = `P${activeImgIndex + 1}: ${img.title || img.name} /`;
          stageTitleEn.textContent = img.title_en || 'ARTWORK';

          const stageParasContainer = document.getElementById('stageParagraphs');
          if (stageParasContainer) {
            stageParasContainer.innerHTML = '';
            const desc = img.description || '';
            const paragraphs = desc.split(/\n+/).map(s => s.trim()).filter(Boolean);
            if (paragraphs.length === 0) {
              paragraphs.push('超高保真大画幅原作展示。每一处光斑与水墨笔触均经过精确渲染，呈现出丰富的层次感与空间景深。');
            }
            paragraphs.forEach(text => {
              const p = document.createElement('p');
              p.textContent = text;
              stageParasContainer.appendChild(p);
            });
          }

          stageReadMoreBtn.onclick = () => {
            openPhotoModal(activeImgIndex);
          };

          this.infoArea.classList.remove('updating');
        }, 150);
      }
    }

    const stage3DController = new Stage3DStreamController();

    // ----------------------------------------------------
    // I. 单图独立全屏展示 Modal
    // ----------------------------------------------------
    function openPhotoModal(imgIndex) {
      if (!currentSeries || !currentSeries.images[imgIndex]) return;
      const img = currentSeries.images[imgIndex];

      photoModalImg.src = img.url;
      photoModalImg.classList.remove('zoomed');

      modalPhotoIndex.textContent = `ARTWORK [0${imgIndex + 1} / 0${currentSeries.count}]`;
      modalPhotoTitle.textContent = img.name.replace(/\.[^/.]+$/, "").replace(/_/g, " ");
      modalPhotoDims.textContent = `${img.width} × ${img.height}`;
      modalPhotoSize.textContent = `${(img.size / (1024 * 1024)).toFixed(2)} MB`;
      modalDownloadBtn.href = img.url;
      modalDownloadBtn.download = img.name;

      photoModalView.classList.add('active');
    }

    function closePhotoModal() {
      photoModalView.classList.remove('active');
      photoModalImg.src = '';
    }

    photoModalCloseBtn.addEventListener('click', closePhotoModal);
    photoModalImg.addEventListener('click', () => {
      photoModalImg.classList.toggle('zoomed');
    });

    // ----------------------------------------------------
    // J. 路由分发器 (Hash Routing)
    // ----------------------------------------------------
    function handleHashRouting() {
      const hash = window.location.hash || '#/';
      const parts = hash.replace(/^#\/?/, '').split('/');

      if (parts[0] === 'series' && parts[1]) {
        const seriesId = decodeURIComponent(parts[1]);
        openSeriesStage(seriesId);
      } else {
        if (currentView !== 'home') {
          triggerCurtain('GALLERY OVERVIEW', () => {
            currentView = 'home';
            viewStage.classList.remove('current');
            viewHome.classList.add('current');
            homeBtn.classList.add('active');
            applyTheme(SERIES_THEMES[0]);
            audioEngine.fadeOut(0.8);
          }, 'up');
        }
      }
    }

    window.addEventListener('hashchange', handleHashRouting);

    // ----------------------------------------------------
    // K. 交互事件
    // ----------------------------------------------------
    function goHome() {
      window.location.hash = '#/';
      searchInput.value = '';
      currentFilter = '';
      searchClearBtn.classList.remove('visible');
      searchShortcut.style.display = 'block';
      renderHomeGrid();
    }
    homeBtn.addEventListener('click', goHome);
    brandBtn.addEventListener('click', goHome);
    navRefHomeBtn.addEventListener('click', goHome);
    navRefPageBtn.addEventListener('click', goHome);

    searchInput.addEventListener('input', (e) => {
      currentFilter = e.target.value;
      if (currentFilter.length > 0) {
        searchClearBtn.classList.add('visible');
        searchShortcut.style.display = 'none';
      } else {
        searchClearBtn.classList.remove('visible');
        searchShortcut.style.display = 'block';
      }
      if (currentView !== 'home') {
        window.location.hash = '#/';
      }
      renderHomeGrid();
    });
    searchInput.addEventListener('focus', () => {
      searchWrapper.classList.add('focused');
      searchShortcut.style.display = 'none';
    });
    searchInput.addEventListener('blur', () => {
      searchWrapper.classList.remove('focused');
      if (!searchInput.value) searchShortcut.style.display = 'block';
    });
    searchClearBtn.addEventListener('click', () => {
      searchInput.value = '';
      currentFilter = '';
      searchClearBtn.classList.remove('visible');
      searchShortcut.style.display = 'block';
      searchInput.focus();
      renderHomeGrid();
    });

    audioToggleBtn.addEventListener('click', () => {
      const isPlaying = audioEngine.toggle();
      if (isPlaying) {
        audioToggleBtn.classList.add('playing');
        audioStatusText.textContent = 'AUDIO // ON';
      } else {
        audioToggleBtn.classList.remove('playing');
        audioStatusText.textContent = 'AUDIO // OFF';
      }
    });

    // 键盘快捷键 (左右箭头轮转卡片，Esc返回)
    window.addEventListener('keydown', (e) => {
      if (photoModalView.classList.contains('active')) {
        if (e.key === 'Escape') closePhotoModal();
        return;
      }
      if (currentView === 'stage') {
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
          stage3DController.targetScroll += 1;
          stage3DController.scheduleSnap();
        } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
          stage3DController.targetScroll -= 1;
          stage3DController.scheduleSnap();
        } else if (e.key === 'Escape') {
          goHome();
        }
        return;
      }
      if ((e.key === '/' || (e.ctrlKey && e.key === 'k')) && document.activeElement !== searchInput) {
        e.preventDefault();
        searchInput.focus();
        searchInput.select();
      } else if (e.key === 'Escape' && document.activeElement === searchInput) {
        searchInput.blur();
      }
    });

    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, t => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[t] || t));
    }

    document.addEventListener('click', function unlockAudio() {
      audioEngine.initContext();
      document.removeEventListener('click', unlockAudio);
    }, { once: true });

    initData();
  </script>
</body>
