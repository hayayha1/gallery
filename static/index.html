<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>画廊 · 艺术展览</title>
  <style>
    /* ========================================================
       1. 基础重置与色彩变量系统
       ======================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      /* 当前主题变量 (随系列动态平滑平滑过渡) */
      --theme-bg: #0b0f17;
      --theme-bg-gradient: radial-gradient(circle at 75% 35%, #182235 0%, #0b0f17 100%);
      --theme-accent: #38bdf8;
      --theme-accent-glow: rgba(56, 189, 248, 0.45);
      --theme-text: #ffffff;
      --theme-text-muted: #94a3b8;
      --theme-border: rgba(255, 255, 255, 0.12);
      --theme-grid-line: rgba(56, 189, 248, 0.18);
      --ease-elastic: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-smooth: cubic-bezier(0.16, 1, 0.3, 1);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background-color: var(--theme-bg);
      color: var(--theme-text);
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
      transition: background-color 0.8s var(--ease-smooth);
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    /* 全屏动态背景 Canvas (绘制星尘浮动、3D透视网格、斜向发光导引线) */
    #bgCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      transition: opacity 0.6s ease;
    }

    /* 滚动条美化 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--theme-accent);
    }

    /* ========================================================
       2. 顶部工具栏 (Navbar)
       保留：主页、搜索、音频控制，以及右侧参考图风格导航指示
       ======================================================== */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 70px;
      z-index: 100;
      display: flex;
      align-items: center;
      padding: 0 40px;
      background: linear-gradient(to bottom, rgba(11, 15, 23, 0.85) 0%, transparent 100%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .navbar-container {
      width: 100%;
      max-width: 1800px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* 品牌区 */
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      text-decoration: none;
    }
    .brand-logo-badge {
      background: linear-gradient(135deg, #ff2a85 0%, #ff529a 100%);
      color: white;
      font-weight: 800;
      font-size: 15px;
      padding: 4px 14px;
      border-radius: 9999px;
      letter-spacing: -0.5px;
      box-shadow: 0 4px 12px rgba(255, 42, 133, 0.35);
    }
    .brand-title {
      font-size: 19px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.5px;
    }

    /* 中部搜索与主页 */
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 16px;
      border-radius: 9999px;
      font-size: 13.5px;
      font-weight: 600;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      transition: all 0.25s ease;
      text-decoration: none;
    }
    .nav-btn:hover, .nav-btn.active {
      color: #ffffff;
      border-color: var(--theme-accent);
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 0 14px var(--theme-accent-glow);
    }

    /* 搜索框 */
    .search-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 240px;
      transition: width 0.3s var(--ease-smooth);
    }
    .search-wrapper.focused {
      width: 340px;
    }
    .search-icon {
      position: absolute;
      left: 12px;
      color: #94a3b8;
      pointer-events: none;
      width: 15px;
      height: 15px;
    }
    .search-input {
      width: 100%;
      height: 36px;
      padding: 6px 34px 6px 36px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.06);
      font-size: 13px;
      color: #ffffff;
      outline: none;
      transition: all 0.2s;
    }
    .search-input:focus {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--theme-accent);
      box-shadow: 0 0 16px var(--theme-accent-glow);
    }
    .search-clear {
      position: absolute;
      right: 12px;
      background: rgba(255, 255, 255, 0.2);
      border: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: white;
      font-size: 11px;
    }
    .search-clear.visible { display: flex; }
    .search-shortcut {
      position: absolute;
      right: 12px;
      padding: 1px 5px;
      background: rgba(255, 255, 255, 0.15);
      color: #94a3b8;
      font-size: 11px;
      border-radius: 4px;
      pointer-events: none;
      font-family: monospace;
    }

    /* 右侧参考图风格导航指示 (首页 页面 一一一 01 / 03) */
    .nav-reference-indicator {
      display: flex;
      align-items: center;
      gap: 24px;
      font-size: 14px;
      color: #cbd5e1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .nav-link-item {
      cursor: pointer;
      transition: color 0.2s;
      letter-spacing: 1px;
    }
    .nav-link-item:hover, .nav-link-item.active {
      color: #ffffff;
      font-weight: 600;
    }
    .nav-dash-progress {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: monospace;
      color: #94a3b8;
    }
    .nav-dashes {
      letter-spacing: 3px;
      color: var(--theme-accent);
      font-weight: 700;
      opacity: 0.85;
    }
    .nav-counter {
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
    }
    .nav-counter span {
      color: #64748b;
      font-size: 13px;
      font-weight: 400;
    }

    /* 全局音频氛围开关 */
    .audio-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.06);
      color: #cbd5e1;
      font-size: 12px;
      cursor: pointer;
      font-family: monospace;
      transition: all 0.25s;
    }
    .audio-pill:hover, .audio-pill.playing {
      border-color: var(--theme-accent);
      color: #ffffff;
      box-shadow: 0 0 12px var(--theme-accent-glow);
    }
    .audio-waveform {
      display: flex;
      align-items: center;
      gap: 2.5px;
      height: 12px;
    }
    .audio-bar {
      width: 2.5px;
      height: 4px;
      background: #64748b;
      border-radius: 2px;
      transition: height 0.2s, background-color 0.2s;
    }
    .audio-pill.playing .audio-bar {
      background: var(--theme-accent);
      animation: soundWave 1.1s ease-in-out infinite alternate;
    }
    .audio-pill.playing .audio-bar:nth-child(1) { animation-delay: 0.1s; }
    .audio-pill.playing .audio-bar:nth-child(2) { animation-delay: 0.3s; }
    .audio-pill.playing .audio-bar:nth-child(3) { animation-delay: 0.2s; }
    .audio-pill.playing .audio-bar:nth-child(4) { animation-delay: 0.4s; }

    @keyframes soundWave {
      0% { height: 3px; }
      100% { height: 13px; }
    }

    /* ========================================================
       3. 方案一：【连续空间穿梭 · 卡片 3D 升空蜕变】 (Spatial Morph & Zoom)
       ======================================================== */
    /* 飞行代理卡片：从主页卡片无缝飞升形变至 3D 展台主角 */
    .morph-flight-proxy {
      position: fixed;
      z-index: 99999;
      pointer-events: none;
      overflow: hidden;
      background: #0d121c;
      border: 1.5px solid rgba(255, 255, 255, 0.28);
      box-shadow: 0 35px 80px rgba(0, 0, 0, 0.85), 0 0 35px var(--theme-accent-glow, rgba(56, 189, 248, 0.4));
      transform-style: preserve-3d;
      will-change: left, top, width, height, transform, border-radius, box-shadow;
      transition: left 0.82s cubic-bezier(0.16, 1, 0.3, 1),
                  top 0.82s cubic-bezier(0.16, 1, 0.3, 1),
                  width 0.82s cubic-bezier(0.16, 1, 0.3, 1),
                  height 0.82s cubic-bezier(0.16, 1, 0.3, 1),
                  border-radius 0.82s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.82s cubic-bezier(0.16, 1, 0.3, 1),
                  box-shadow 0.82s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .morph-flight-proxy img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .morph-flight-glare {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0) 65%);
      pointer-events: none;
      mix-blend-mode: overlay;
    }

    /* 主页其他卡片在卡片升空时的景深退后虚化 */
    .home-card.receding {
      transform: scale(0.94) translateY(12px) !important;
      opacity: 0.25 !important;
      filter: blur(4px) brightness(0.5) !important;
      pointer-events: none !important;
      transition: all 0.6s var(--ease-smooth) !important;
    }

    /* 优雅浮动 HUD 提示，配合渐变流光 */
    .transition-curtain {
      position: fixed;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      z-index: 9999;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.4s var(--ease-smooth);
    }
    .transition-curtain.active {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .curtain-text {
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 10px 24px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6), 0 0 20px var(--theme-accent-glow);
    }
    .curtain-spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-top-color: var(--theme-accent);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 视图切换容器 */
    .view-section {
      display: none;
      width: 100%;
      min-height: 100vh;
      position: relative;
      z-index: 1;
    }
    .view-section.current {
      display: block;
    }

    /* ========================================================
       4. 视图一：主页系列瀑布流 (Home Grid View)
       ======================================================== */
    .home-container {
      width: 100%;
      max-width: 1800px;
      margin: 0 auto;
      padding: 94px 32px 80px 32px;
    }
    .home-status-bar {
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #94a3b8;
      font-size: 14px;
    }
    .home-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.06);
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-weight: 500;
    }
    .home-status-badge span {
      color: var(--theme-accent);
      font-weight: 700;
    }

    .masonry-grid {
      display: flex;
      gap: 22px;
      width: 100%;
      align-items: flex-start;
    }
    .masonry-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 22px;
      min-width: 0;
    }
    .home-card {
      position: relative;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      transition: transform 0.4s var(--ease-smooth),
                  box-shadow 0.4s var(--ease-smooth),
                  border-color 0.4s ease;
    }
    .home-card:hover {
      transform: translateY(-8px) scale(1.01);
      box-shadow: 0 24px 45px -8px var(--theme-accent-glow), 0 10px 20px rgba(0, 0, 0, 0.5);
      border-color: var(--theme-accent);
    }
    .home-card-media {
      position: relative;
      width: 100%;
      background: #0f172a;
      overflow: hidden;
    }
    .home-card-img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.6s var(--ease-smooth);
    }
    .home-card:hover .home-card-img {
      transform: scale(1.04);
    }
    .home-card-badge {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(8px);
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 11px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 5px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .home-card:hover .home-card-badge {
      background: var(--theme-accent);
      color: #000000;
      font-weight: 700;
    }
    .home-card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(10, 13, 20, 0.95) 0%, rgba(10, 13, 20, 0.35) 50%, transparent 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 22px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .home-card:hover .home-card-overlay {
      opacity: 1;
    }
    .home-card-title {
      color: #ffffff;
      font-size: 16.5px;
      font-weight: 700;
      margin-bottom: 6px;
      word-break: break-all;
    }
    .home-card-hint {
      color: var(--theme-accent);
      font-size: 12px;
      font-weight: 600;
    }

    /* ========================================================
       5. 视图二：【HuyML 风格 3D 轮转展台】：60% 图片队列 + 40% 联动图文
       ======================================================== */
    .stage-view-wrapper {
      width: 100vw;
      height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 70px 48px 30px 48px;
      overflow: hidden;
    }

    /* 左侧 60% 宽度：3D 透视流动流视口 (超过中线达到 60%) */
    .stage-stream-area {
      position: relative;
      width: 60%;
      height: 100%;
      perspective: 1400px;
      perspective-origin: 50% 55%;
      overflow: visible;
      cursor: grab;
      user-select: none;
      z-index: 5;
    }
    .stage-stream-area:active {
      cursor: grabbing;
    }

    .stage-3d-deck {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
    }

    /* 每一个 3D 卡片槽位 */
    .deck-card-item {
      position: absolute;
      width: 360px;
      height: 510px;
      border-radius: 18px;
      cursor: pointer;
      transform-style: preserve-3d;
      will-change: transform, opacity, filter, box-shadow;
      transition: box-shadow 0.3s ease, border-color 0.3s ease;
      background: #0d121c;
      border: 1.5px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 25px 60px -10px rgba(0, 0, 0, 0.85);
      user-select: none;
    }

    .deck-card-item.is-active {
      border-color: rgba(255, 255, 255, 0.75);
      box-shadow: 0 35px 85px -10px rgba(0, 0, 0, 0.95), 0 0 45px var(--theme-accent-glow);
    }

    .deck-card-item:hover {
      border-color: var(--theme-accent);
    }

    /* 卡片顶部的 P1 / P2 / P3 标注文本 */
    .deck-card-tag {
      position: absolute;
      top: -50px;
      left: 4px;
      font-size: 40px;
      font-weight: 800;
      font-family: Georgia, "Times New Roman", "Songti SC", "SimSun", serif;
      color: #ffffff !important;
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.95);
      pointer-events: none;
      z-index: 10 !important;
      letter-spacing: 1px;
    }

    /* 卡片图片容器 */
    .deck-card-media {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      border-radius: 16px;
    }
    .deck-card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    /* 滚动交互提示徽章 */
    .stage-scroll-badge {
      position: absolute;
      bottom: 24px;
      left: 24px;
      padding: 7px 16px;
      border-radius: 9999px;
      border: 1px solid rgba(56, 189, 248, 0.35);
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(10px);
      color: var(--theme-accent);
      font-size: 12px;
      font-family: monospace;
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      z-index: 20;
      animation: pulseScrollBadge 2.4s infinite;
    }
    @keyframes pulseScrollBadge {
      0%, 100% { opacity: 0.75; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-4px); }
    }

    /* ----------------------------------------------------
       右侧 40% 宽度：图文联动展示区 (删去 SERIES INDEX，提升高级留白)
       ---------------------------------------------------- */
    .stage-info-content {
      width: 40%;
      max-width: 620px;
      display: flex;
      flex-direction: column;
      gap: 28px;
      padding-left: 40px;
      padding-right: 20px;
      position: relative;
      z-index: 10;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .stage-info-content.updating {
      opacity: 0.15;
      transform: translateY(6px);
    }

    /* 主标题：P1:倾国 / FATAL BEAUTY */
    .stage-title-block {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .stage-main-title {
      font-size: 52px;
      font-weight: 800;
      color: #ffffff;
      font-family: Georgia, "Times New Roman", "Songti SC", "SimSun", serif;
      letter-spacing: -0.5px;
      line-height: 1.15;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    .stage-sub-title {
      font-size: 40px;
      font-weight: 800;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      letter-spacing: 2px;
      line-height: 1.15;
      text-transform: uppercase;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    /* 杂志正文段落排版 (来自 description 文件) */
    .stage-paragraphs {
      display: flex;
      flex-direction: column;
      gap: 16px;
      font-size: 15px;
      line-height: 1.85;
      color: #cbd5e1;
      text-align: justify;
    }
    .stage-paragraphs p {
      letter-spacing: 0.3px;
    }

    /* READ MORE 按钮 */
    .stage-action-row {
      display: flex;
      align-items: center;
      gap: 28px;
      margin-top: 10px;
    }
    .stage-read-more-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      background: none;
      border: none;
      cursor: pointer;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      letter-spacing: 1.5px;
      transition: all 0.25s ease;
      text-decoration: none;
      padding: 6px 0;
      border-bottom: 2px solid transparent;
    }
    .stage-read-more-btn:hover {
      color: var(--theme-accent);
      border-bottom-color: var(--theme-accent);
      transform: translateX(4px);
    }
    .stage-read-more-btn svg {
      transition: transform 0.25s ease;
    }
    .stage-read-more-btn:hover svg {
      transform: translateX(6px);
    }

    /* ========================================================
       6. 视图三：【单图独立全屏展台】
       ======================================================== */
    .photo-modal-view {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(8, 11, 16, 0.95);
      backdrop-filter: blur(16px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;

    // ----------------------------------------------------
    class DynamicBackgroundEngine {
      constructor(canvasId) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d');
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.particles = [];
        this.theme = SERIES_THEMES[0];
        this.time = 0;
        this.mouseX = this.width / 2;
        this.mouseY = this.height / 2;

        this.initCanvas();
        this.initParticles();
        this.bindEvents();
        this.animate();
      }

      initCanvas() {
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.canvas.width = this.width * window.devicePixelRatio;
        this.canvas.height = this.height * window.devicePixelRatio;
        this.ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
      }

      initParticles() {
        this.particles = [];
        const count = 55;
        for (let i = 0; i < count; i++) {
          this.particles.push({
            x: Math.random() * this.width,
            y: Math.random() * this.height,
            size: Math.random() * 2.2 + 0.6,
            speedX: (Math.random() - 0.5) * 0.4,
            speedY: (Math.random() - 0.5) * 0.5,
            opacity: Math.random() * 0.7 + 0.3,
            pulseSpeed: Math.random() * 0.03 + 0.015,
            pulsePhase: Math.random() * Math.PI * 2
          });
        }
      }

      setTheme(newTheme) {
        this.theme = newTheme;
      }

      bindEvents() {
        window.addEventListener('resize', () => {
          this.initCanvas();
          this.initParticles();
        });
        window.addEventListener('mousemove', (e) => {
          this.mouseX = e.clientX;
          this.mouseY = e.clientY;
        });
      }

      drawPerspectiveGrid() {
        const ctx = this.ctx;
        const w = this.width;
        const h = this.height;

        // 绘制右下角科技艺术透视网格 (参考图中右下角的透视网格)
        const originX = w * 0.95;
        const originY = h * 0.62;
        const gridW = w * 0.45;
        const gridH = h * 0.38;

        ctx.save();
        ctx.strokeStyle = this.theme.gridRgba;
        ctx.lineWidth = 1;

        // 纵深辐射线
        const rayCount = 10;
        for (let i = 0; i <= rayCount; i++) {
          const t = i / rayCount;
          const startX = originX - gridW * (1 - t * 0.3);
          const startY = h;
          ctx.beginPath();
          ctx.moveTo(startX, startY);
          ctx.lineTo(originX + t * 40, originY);
          ctx.stroke();
        }

        // 水平透视线 (间距由密到疏)
        const horizCount = 7;
        for (let j = 1; j <= horizCount; j++) {
          const progress = Math.pow(j / horizCount, 2);
          const currentY = originY + (h - originY) * progress;
          const currentXStart = originX - gridW * progress;
          ctx.beginPath();
          ctx.moveTo(currentXStart, currentY);
          ctx.lineTo(w, currentY);
          ctx.stroke();
        }

        ctx.restore();
      }

      drawDiagonalLuminousArrow() {
        const ctx = this.ctx;
        const w = this.width;
        const h = this.height;

        // 根据用户构图手绘草图：斜向贯穿光束箭头贯穿整个卡片队列中心，延伸至 60% 位置
        const startX = w * 0.58;
        const startY = h * 0.16;
        const endX = w * 0.03;
        const endY = h * 0.94;

        ctx.save();
        // 外部微光晕
        ctx.strokeStyle = this.theme.glowRgba;
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(endX, endY);
        ctx.stroke();

        // 内部核心高亮线
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(endX, endY);
        ctx.stroke();

        // 沿轨道滑动的发光能量粒子 (视觉引导流动方向)
        const trackT = (this.time * 0.25) % 1.0;
        const beamPx = startX + (endX - startX) * trackT;
        const beamPy = startY + (endY - startY) * trackT;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(beamPx, beamPy, 3.5, 0, Math.PI * 2);
        ctx.fill();

        // 左下端发光箭头
        const arrowAngle = Math.atan2(endY - startY, endX - startX);
        const headLen = 22;
        ctx.beginPath();
        ctx.moveTo(endX, endY);
        ctx.lineTo(endX - headLen * Math.cos(arrowAngle - Math.PI / 6), endY - headLen * Math.sin(arrowAngle - Math.PI / 6));
        ctx.moveTo(endX, endY);
        ctx.lineTo(endX - headLen * Math.cos(arrowAngle + Math.PI / 6), endY - headLen * Math.sin(arrowAngle + Math.PI / 6));
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();

        // 箭头端点星芒光晕
        const pulse = Math.sin(this.time * 2.5) * 6 + 18;
        const glowGrad = ctx.createRadialGradient(endX, endY, 1, endX, endY, pulse);
        glowGrad.addColorStop(0, '#ffffff');
        glowGrad.addColorStop(0.3, this.theme.accentHex);
        glowGrad.addColorStop(1, 'transparent');
        ctx.fillStyle = glowGrad;
        ctx.beginPath();
        ctx.arc(endX, endY, pulse, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      drawParticles() {
        const ctx = this.ctx;
        const mouseOffsetX = (this.mouseX - this.width / 2) * 0.03;
        const mouseOffsetY = (this.mouseY - this.height / 2) * 0.03;

        this.particles.forEach(p => {
          p.x += p.speedX;
          p.y += p.speedY;
          if (p.x < 0) p.x = this.width;
          if (p.x > this.width) p.x = 0;
          if (p.y < 0) p.y = this.height;
          if (p.y > this.height) p.y = 0;

          const currentOpacity = p.opacity * (0.6 + 0.4 * Math.sin(this.time * p.pulseSpeed + p.pulsePhase));
          const posX = p.x + mouseOffsetX;
          const posY = p.y + mouseOffsetY;

          ctx.fillStyle = `rgba(255, 255, 255, ${currentOpacity})`;
          ctx.beginPath();
          ctx.arc(posX, posY, p.size, 0, Math.PI * 2);
          ctx.fill();

          // 核心亮点外晕
          if (p.size > 1.6) {
            ctx.fillStyle = this.theme.glowRgba;
            ctx.beginPath();
            ctx.arc(posX, posY, p.size * 2.6, 0, Math.PI * 2);
            ctx.fill();
          }
        });
      }

      animate() {
        this.time += 0.04;
        this.ctx.clearRect(0, 0, this.width, this.height);

        // 绘制动态透视网格
        this.drawPerspectiveGrid();
        // 绘制斜向贯穿光束箭头
        this.drawDiagonalLuminousArrow();
        // 绘制浮动星尘粒子
        this.drawParticles();

        requestAnimationFrame(() => this.animate());
      }
    }

    // ----------------------------------------------------
    // C. Web Audio API 沉浸式环境音频合成器
    // ----------------------------------------------------
    class AmbientAudioEngine {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.isPlaying = false;
        this.currentNodes = [];
        this.baseFreq = 55;
        this.userMuted = true;
      }

      initContext() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
          this.masterGain = this.ctx.createGain();
          this.masterGain.gain.setValueAtTime(0, this.ctx.currentTime);
          this.masterGain.connect(this.ctx.destination);
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playTheme(freq = 55) {
        this.initContext();
        this.baseFreq = freq;
        this.stopCurrent();

        const now = this.ctx.currentTime;
        const osc1 = this.ctx.createOscillator();
        const gain1 = this.ctx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(freq, now);
        gain1.gain.setValueAtTime(0.18, now);
        osc1.connect(gain1);
        gain1.connect(this.masterGain);
        osc1.start();
        this.currentNodes.push(osc1, gain1);

        const osc2 = this.ctx.createOscillator();
        const gain2 = this.ctx.createGain();
        osc2.type = 'triangle';
        osc2.frequency.setValueAtTime(freq * 1.5 + 0.8, now);
        gain2.gain.setValueAtTime(0.06, now);
        osc2.connect(gain2);
        gain2.connect(this.masterGain);
        osc2.start();
        this.currentNodes.push(osc2, gain2);

        if (!this.userMuted) {
          this.fadeIn(1.2);
          this.isPlaying = true;
        }
      }

      stopCurrent() {
        if (!this.ctx) return;
        this.currentNodes.forEach(node => {
          try {
            if (node.stop) node.stop();
            node.disconnect();
          } catch(e) {}
        });
        this.currentNodes = [];
      }

      fadeIn(duration = 1.0) {
        if (!this.ctx || this.userMuted) return;
        const now = this.ctx.currentTime;
        this.masterGain.gain.cancelScheduledValues(now);
        this.masterGain.gain.setValueAtTime(this.masterGain.gain.value, now);
        this.masterGain.gain.linearRampToValueAtTime(0.35, now + duration);
        this.isPlaying = true;
      }

      fadeOut(duration = 0.8) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        this.masterGain.gain.cancelScheduledValues(now);
        this.masterGain.gain.setValueAtTime(this.masterGain.gain.value, now);
        this.masterGain.gain.linearRampToValueAtTime(0, now + duration);
        this.isPlaying = false;
      }

      toggle() {
        this.initContext();
        this.userMuted = !this.userMuted;
        if (this.userMuted) {
          this.fadeOut(0.6);
        } else {
          this.playTheme(this.baseFreq);
          this.fadeIn(0.8);
        }
        return !this.userMuted;
      }
    }

    // ----------------------------------------------------
    let lastClickedCard = null;
    let isTransitioning = false;

    function triggerCurtain(title, callback, direction) {
      const isEnteringStage = currentView === 'home';
      const isBackward = direction === 'up' || (!isEnteringStage && direction !== 'down');

      if (isBackward) {
        triggerSpatialMorphBackward(callback);
      } else {
        triggerSpatialMorphForward(callback);
      }
    }

    // 前进：点击主页卡片 -> 卡片 3D 升空蜕变至 3D 展台主角
    function triggerSpatialMorphForward(callback) {
      if (isTransitioning) {
        if (callback) callback();
        return;
      }
      isTransitioning = true;

      // 1. 定位源卡片
      let sourceCard = lastClickedCard;
      if (!sourceCard || !document.body.contains(sourceCard)) {
        if (currentSeries) {
          sourceCard = document.querySelector(`.home-card[data-id="${currentSeries.id}"]`);
        }
      }

      // 降级兜底切换
      if (!sourceCard) {
        viewHome.classList.remove('current');
        viewStage.classList.add('current');
        if (callback) callback();
        isTransitioning = false;
        return;
      }

      const startRect = sourceCard.getBoundingClientRect();
      const imgEl = sourceCard.querySelector('.home-card-img');
      const imgSrc = imgEl ? imgEl.src : (currentSeries ? currentSeries.cover_thumb : '');

      // 2. 主页其他卡片优雅退后景深虚化，源卡片占位隐形
      document.querySelectorAll('.home-card').forEach(c => {
        if (c !== sourceCard) {
          c.classList.add('receding');
        }
      });
      sourceCard.style.opacity = '0';

      // 3. 创建 3D 飞行代理卡片 (Morph Hero Proxy)
      const proxy = document.createElement('div');
      proxy.className = 'morph-flight-proxy';
      proxy.style.left = `${startRect.left}px`;
      proxy.style.top = `${startRect.top}px`;
      proxy.style.width = `${startRect.width}px`;
      proxy.style.height = `${startRect.height}px`;
      proxy.style.borderRadius = '14px';
      proxy.innerHTML = `
        <img src="${imgSrc}" alt="" />
        <div class="morph-flight-glare"></div>
      `;
      document.body.appendChild(proxy);

      // 4. 准备展台视图与 DOM 初始化
      viewStage.style.display = 'block';
      viewStage.style.position = 'fixed';
      viewStage.style.inset = '0';
      viewStage.style.zIndex = '60';
      viewStage.style.opacity = '0';
      viewStage.style.transition = 'opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1)';

      const stageInfo = document.getElementById('stageInfoContent');
      if (stageInfo) {
        stageInfo.style.transform = 'translateY(40px)';
        stageInfo.style.opacity = '0';
        stageInfo.style.transition = 'transform 0.85s cubic-bezier(0.16, 1, 0.3, 1) 0.1s, opacity 0.85s ease 0.1s';
      }

      // 执行外部数据初始化 (渲染 3D 轮转展台)
      if (callback) callback();

      // 暂时隐藏主角卡片，待飞行代理就位后无缝接管
      const targetCard = (typeof stage3DController !== 'undefined' && stage3DController.cardElements) ? stage3DController.cardElements[0] : null;
      if (targetCard) {
        targetCard.style.opacity = '0';
      }

      // 获取展台主角卡片目标坐标
      let targetRect = null;
      if (targetCard) {
        const r = targetCard.getBoundingClientRect();
        if (r.width > 0 && r.height > 0) {
          targetRect = r;
        }
      }
      if (!targetRect) {
        const areaW = window.innerWidth * 0.6;
        const left = Math.round(areaW * 0.24 + areaW * 0.1);
        const top = Math.round(window.innerHeight * 0.5 - 255);
        targetRect = { left: Math.max(left, 40), top: Math.max(top, 60), width: 360, height: 510 };
      }

      // 5. 下一帧触发空间飞行蜕变
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          // 主页整体微缩淡出
          viewHome.style.transition = 'opacity 0.6s ease, transform 0.82s cubic-bezier(0.16, 1, 0.3, 1)';
          viewHome.style.opacity = '0';
          viewHome.style.transform = 'scale(0.96)';

          // 展台渐入并推升图文
          viewStage.style.opacity = '1';
          if (stageInfo) {
            stageInfo.style.transform = 'translateY(0)';
            stageInfo.style.opacity = '1';
          }

          // 代理卡片在 3D 空间中飞升与微倾
          proxy.style.left = `${targetRect.left}px`;
          proxy.style.top = `${targetRect.top}px`;
          proxy.style.width = `${targetRect.width}px`;
          proxy.style.height = `${targetRect.height}px`;
          proxy.style.borderRadius = '18px';
          proxy.style.transform = 'translateZ(60px) rotateY(-4deg)';
        });
      });

      // 6. 飞行合体交接完成 (840ms)
      setTimeout(() => {
        if (targetCard) {
          targetCard.style.opacity = '';
        }
        proxy.remove();

        viewHome.classList.remove('current');
        viewHome.style.display = '';
        viewHome.style.opacity = '';
        viewHome.style.transform = '';
        viewHome.style.transition = '';

        document.querySelectorAll('.home-card').forEach(c => {
          c.classList.remove('receding');
          c.style.opacity = '';
        });

        viewStage.classList.add('current');
        viewStage.style.display = '';
        viewStage.style.position = '';
        viewStage.style.inset = '';
        viewStage.style.zIndex = '';
        viewStage.style.opacity = '';
        viewStage.style.transition = '';

        if (stageInfo) {
          stageInfo.style.transform = '';
          stageInfo.style.opacity = '';
          stageInfo.style.transition = '';
        }

        isTransitioning = false;
        lastClickedCard = null;
      }, 840);
    }

    // 回退：从展台返回主页 -> 展台主角卡片平滑飞回主页对应槽位
    function triggerSpatialMorphBackward(callback) {
      if (isTransitioning) {
        if (callback) callback();
        return;
      }
      isTransitioning = true;

      // 1. 获取当前展台主角卡片位置
      const activeIdx = (typeof stage3DController !== 'undefined' && stage3DController.activeIdx) || 0;
      const stageCard = (typeof stage3DController !== 'undefined' && stage3DController.cardElements) ? stage3DController.cardElements[activeIdx] : null;
      const startRect = stageCard ? stageCard.getBoundingClientRect() : {
        left: window.innerWidth * 0.25,
        top: window.innerHeight * 0.2,
        width: 360,
        height: 510
      };

      // 2. 找到对应的主页系列卡片
      const homeCard = currentSeries ? document.querySelector(`.home-card[data-id="${currentSeries.id}"]`) : null;

      // 4. 主页在后台呈现并由缩放恢复
      viewHome.style.display = 'block';

      viewHome.style.inset = '0';
      viewHome.style.zIndex = '40';

      if (callback) callback();

      // 确保主页其他卡片保持虚化，目标卡片留白
      if (homeCard) {
        document.querySelectorAll('.home-card').forEach(c => {
          if (c !== homeCard) c.classList.add('receding');
        });
        homeCard.style.opacity = '0';
      }

      let targetRect = homeCard ? homeCard.getBoundingClientRect() : null;
      if (!targetRect || targetRect.width === 0) {
        targetRect = { left: window.innerWidth * 0.5 - 150, top: 150, width: 300, height: 400 };
      }

      // 5. 下一帧触发卡片回落降落
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          viewHome.style.opacity = '1';
          viewHome.style.transform = 'scale(1)';

          document.querySelectorAll('.home-card').forEach(c => {
            c.classList.remove('receding');
          });

          proxy.style.left = `${targetRect.left}px`;
          proxy.style.top = `${targetRect.top}px`;
          proxy.style.width = `${targetRect.width}px`;
          proxy.style.height = `${targetRect.height}px`;
          proxy.style.borderRadius = '14px';
          proxy.style.transform = 'translateZ(0) rotateY(0deg)';
        });
      });

      // 6. 回归完成
      setTimeout(() => {
        if (homeCard) {
          homeCard.style.opacity = '';
        }
        proxy.remove();

        viewStage.classList.remove('current');
        viewStage.style.display = '';
        viewStage.style.opacity = '';
        viewStage.style.transition = '';

        if (stageInfo) {
          stageInfo.style.transform = '';
          stageInfo.style.opacity = '';
          stageInfo.style.transition = '';
        }

        viewHome.classList.add('current');
        viewHome.style.display = '';
        viewHome.style.position = '';
        viewHome.style.inset = '';
        viewHome.style.zIndex = '';
        viewHome.style.opacity = '';
        viewHome.style.transform = '';
        viewHome.style.transition = '';

        isTransitioning = false;
      }, 840);
    }

    function applyTheme(theme) {
      const root = document.documentElement;
      root.style.setProperty('--theme-bg', theme.bgHex);
      root.style.setProperty('--theme-accent', theme.accentHex);
      root.style.setProperty('--theme-accent-glow', theme.glowRgba);
      root.style.setProperty('--theme-grid-line', theme.gridRgba);

      // 同步 Canvas 动态背景颜色
      bgEngine.setTheme(theme);
    }

        });

        cols[minCol].appendChild(card);
        const ratio = series.cover_aspect_ratio || 1.33;
        colHeights[minCol] += (300 / ratio) + 20;
      });
    }

    // ----------------------------------------------------
    // H. 【参考图 100% 构图】：进入系列展览主舞台
    // ----------------------------------------------------
    function openSeriesStage(seriesId) {
      const seriesIndex = allSeries.findIndex(s => s.id === seriesId);
      if (seriesIndex === -1) {
        window.location.hash = '#/';
        return;
      }

      currentSeries = allSeries[seriesIndex];
      const theme = getThemeForSeries(seriesIndex);

      triggerCurtain(currentSeries.title, () => {
        currentView = 'stage';
        viewHome.classList.remove('current');
        viewStage.classList.add('current');
        homeBtn.classList.remove('active');

        // 应用系列专属主题色彩与背景
        applyTheme(theme);
        // 播放专属背景音乐
        audioEngine.playTheme(theme.audioFreq);

        // 启动 HuyML 风格 3D 无限循环流转引擎 (60%图片队列 + 40%联动图文)
        stage3DController.init(currentSeries.images);
      }, 'down');
    }

    // ========================================================
    // HuyML 风格 3D 轴向无限循环流转引擎 (Infinite 3D Stream Carousel)
    // ========================================================
    class Stage3DStreamController {
      constructor() {
        this.container = document.getElementById('stageStreamArea');
        this.deck = document.getElementById('stageCardsDeck');
        this.infoArea = document.getElementById('stageInfoContent');
        this.cardElements = [];
        this.currentScroll = 0;
        this.targetScroll = 0;
        this.activeIdx = 0;
        this.isAnimating = false;
        this.snapTimer = null;
        this.isDragging = false;
        this.dragStartY = 0;
        this.dragStartScroll = 0;
        this.hasMoved = false;

        this.bindEvents();
      }

      bindEvents() {
        // 滚轮控制平滑滚动
        this.container.addEventListener('wheel', (e) => {
          e.preventDefault();
          const delta = Math.sign(e.deltaY) * Math.min(Math.abs(e.deltaY), 80);
          this.targetScroll += delta * 0.0035;
          this.scheduleSnap();
        }, { passive: false });

        // 触控与鼠标拖拽
        const onPointerDown = (e) => {
          this.isDragging = true;
          this.hasMoved = false;
          this.dragStartY = e.clientY || (e.touches && e.touches[0].clientY) || 0;
          this.dragStartScroll = this.targetScroll;
        };

        const onPointerMove = (e) => {
          if (!this.isDragging) return;
          const clientY = e.clientY || (e.touches && e.touches[0].clientY) || 0;
          const diff = this.dragStartY - clientY;
          if (Math.abs(diff) > 4) {
            this.hasMoved = true;
          }
          this.targetScroll = this.dragStartScroll + diff * 0.0035;
        };

        const onPointerUp = () => {
          if (!this.isDragging) return;
          this.isDragging = false;
          this.scheduleSnap();
        };

        this.container.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);

        this.container.addEventListener('touchstart', onPointerDown, { passive: true });
        window.addEventListener('touchmove', onPointerMove, { passive: true });
        window.addEventListener('touchend', onPointerUp);
      }

      scheduleSnap() {
        clearTimeout(this.snapTimer);
        this.snapTimer = setTimeout(() => {
          this.targetScroll = Math.round(this.targetScroll);
        }, 120);
      }

      init(images) {
        this.images = images || [];
        this.count = this.images.length;
        this.deck.innerHTML = '';
        this.cardElements = [];
        this.currentScroll = 0;
        this.targetScroll = 0;
        this.activeIdx = 0;

        if (this.count === 0) return;

        // 创建每个卡片 DOM
        this.images.forEach((img, i) => {
          const card = document.createElement('div');
          card.className = 'deck-card-item';
          card.dataset.index = i;
          
          card.innerHTML = `
            <div class="deck-card-tag" id="cardTag_${i}">P${i + 1}</div>
            <div class="deck-card-media">
              <img class="deck-card-img" src="${img.url}" alt="${escapeHtml(img.name)}" loading="lazy" />
            </div>
          `;

          // 鼠标悬停弹性拉扯反馈
          card.addEventListener('mouseenter', () => {
            card.dataset.hovered = 'true';
          });
          card.addEventListener('mouseleave', () => {
            card.dataset.hovered = 'false';
          });

          // 点击事件：聚焦点卡片打开全屏大图，背景卡片点击旋转至主位
          card.addEventListener('click', (e) => {
            if (this.hasMoved) return; // 拖拽中不触发点击
            const currentDiff = this.getCardRelativePos(i);
            if (Math.abs(currentDiff) < 0.45) {
              // 当前主角卡片
              openPhotoModal(i);
            } else {
              // 背景队列卡片，点击顺滑滑行至主角位
              this.targetScroll += Math.round(currentDiff);
              this.scheduleSnap();
            }
          });

          this.deck.appendChild(card);
          this.cardElements.push(card);
        });

        if (!this.isAnimating) {
          this.isAnimating = true;
          this.loop();
        }

        // 初始化更新右侧文本
        this.updateEditorial(0);
      }

      getCardRelativePos(index) {
        const N = this.count;
        if (N === 0) return 0;
        let diff = (index - this.currentScroll) % N;
        while (diff < -1.5) diff += N;
        while (diff >= N - 1.5) diff -= N;
        return diff;
      }

      interpolateKeyframes(p) {
        // 关键帧定义沿着 60% 构图对角线 (从左下移出到右上深入)
        const kfs = [
          { p: -1.2, x: -0.15, y: 0.98, z: 140, s: 1.20, rx: 2, ry: 6, rz: -10, op: 0.0, br: 0.6 },
          { p: -0.6, x: 0.05,  y: 0.82, z: 80,  s: 1.10, rx: 5, ry: 9, rz: -7,  op: 0.5, br: 0.85 },
          { p: 0.0,  x: 0.24,  y: 0.64, z: 30,  s: 1.04, rx: 8, ry: 12, rz: -4, op: 1.0, br: 1.0 },
          { p: 1.0,  x: 0.50,  y: 0.42, z: -80, s: 0.88, rx: 14, ry: 16, rz: -2, op: 0.88, br: 0.82 },
          { p: 2.0,  x: 0.76,  y: 0.22, z: -200,s: 0.72, rx: 18, ry: 20, rz: 3,  op: 0.70, br: 0.68 },
          { p: 3.0,  x: 0.92,  y: 0.12, z: -340,s: 0.56, rx: 22, ry: 24, rz: 6,  op: 0.40, br: 0.52 },
          { p: 4.0,  x: 1.05,  y: 0.05, z: -500,s: 0.42, rx: 25, ry: 26, rz: 8,  op: 0.0, br: 0.3 }
        ];

        if (p <= kfs[0].p) return kfs[0];
        if (p >= kfs[kfs.length - 1].p) return kfs[kfs.length - 1];

        for (let i = 0; i < kfs.length - 1; i++) {
          const k1 = kfs[i];
          const k2 = kfs[i + 1];
          if (k1.p <= p && p <= k2.p) {
            const t = (p - k1.p) / (k2.p - k1.p);
            return {
              x: k1.x + (k2.x - k1.x) * t,
              y: k1.y + (k2.y - k1.y) * t,
              z: k1.z + (k2.z - k1.z) * t,
              s: k1.s + (k2.s - k1.s) * t,
              rx: k1.rx + (k2.rx - k1.rx) * t,
              ry: k1.ry + (k2.ry - k1.ry) * t,
              rz: k1.rz + (k2.rz - k1.rz) * t,
              op: k1.op + (k2.op - k1.op) * t,
              br: k1.br + (k2.br - k1.br) * t
            };
          }
        }
        return kfs[2];
      }

      loop() {
        if (!currentSeries || currentView !== 'stage') {
          this.isAnimating = false;
          return;
        }

        // 物理平滑缓动 Lerp
        this.currentScroll += (this.targetScroll - this.currentScroll) * 0.09;

        const containerRect = this.container.getBoundingClientRect();
        const cw = containerRect.width || (window.innerWidth * 0.6);
        const ch = containerRect.height || window.innerHeight;

        const N = this.count;
        const normalizedActive = ((Math.round(this.currentScroll) % N) + N) % N;

        if (normalizedActive !== this.activeIdx) {
          this.activeIdx = normalizedActive;
          this.updateEditorial(this.activeIdx);
        }

        // 渲染每张卡片
        this.cardElements.forEach((card, i) => {
          let p = (i - this.currentScroll) % N;
          while (p < -1.5) p += N;
          while (p >= N - 1.5) p -= N;

          // 距离视野外直接隐藏优化性能
          if (p < -1.4 || p > 4.2) {
            card.style.display = 'none';
            return;
          }
          card.style.display = 'block';

          const trans = this.interpolateKeyframes(p);
          const isHovered = card.dataset.hovered === 'true';

          // 卡片中心像素计算
          let pixelX = trans.x * cw - 180; // 减去卡片半宽 360/2
          let pixelY = trans.y * ch - 255; // 减去卡片半高 510/2
          let scale = trans.s;
          let translateZ = trans.z;
          let rotateX = trans.rx;
          let rotateY = trans.ry;
          let rotateZ = trans.rz;

          // 悬停弹性向外拉扯效果
          if (isHovered) {
            pixelX -= 25;
            pixelY -= 25;
            translateZ += 40;
            scale *= 1.05;
          }

          // 动态标签更新：每张卡片保持其专属编号 P1, P2, P3...
          const tagEl = document.getElementById(`cardTag_${i}`);
          if (tagEl) {
            tagEl.textContent = `P${i + 1}`;
            tagEl.style.opacity = Math.max(0, trans.op);
          }

          card.style.transform = `translate3d(${pixelX.toFixed(1)}px, ${pixelY.toFixed(1)}px, ${translateZ.toFixed(1)}px) scale(${scale.toFixed(3)}) rotateX(${rotateX.toFixed(1)}deg) rotateY(${rotateY.toFixed(1)}deg) rotateZ(${rotateZ.toFixed(1)}deg)`;
          card.style.opacity = trans.op.toFixed(3);
          card.style.filter = `brightness(${trans.br.toFixed(2)})`;
          card.style.zIndex = Math.round((1 - Math.abs(p) * 0.25) * 50);

          if (Math.abs(p) < 0.4) {
            card.classList.add('is-active');
          } else {
            card.classList.remove('is-active');
          }
        });

        requestAnimationFrame(() => this.loop());
      }

      updateEditorial(activeImgIndex) {
        if (!currentSeries || !currentSeries.images[activeImgIndex]) return;
        const img = currentSeries.images[activeImgIndex];
        const total = currentSeries.count;
        const padNum = String(activeImgIndex + 1).padStart(2, '0');
        const padTotal = String(total).padStart(2, '0');

        // 更新导航右上角计数器
        navRefCounter.innerHTML = `${padNum} <span>/ ${padTotal}</span>`;

        // 微过渡淡入淡出动画
        this.infoArea.classList.add('updating');
        setTimeout(() => {
          stageTitleZh.textContent = `P${activeImgIndex + 1}:${img.title || img.name} /`;
          stageTitleEn.textContent = img.title_en || 'ARTWORK';

          const stageParasContainer = document.getElementById('stageParagraphs');
          if (stageParasContainer) {
            stageParasContainer.innerHTML = '';
            const desc = img.description || '';
            const paragraphs = desc.split(/\n+/).map(s => s.trim()).filter(Boolean);
            if (paragraphs.length === 0) {
              paragraphs.push('超高保真大画幅原作展示。每一处光斑与水墨笔触均经过精确渲染，呈现出丰富的层次感与空间景深。');
            }
            paragraphs.forEach(text => {
              const p = document.createElement('p');
              p.textContent = text;
              stageParasContainer.appendChild(p);
            });
          }

          stageReadMoreBtn.onclick = () => {
            openPhotoModal(activeImgIndex);
          };

          this.infoArea.classList.remove('updating');
        }, 150);
      }
    }

    const stage3DController = new Stage3DStreamController();

    // ----------------------------------------------------
    // I. 单图独立全屏展示 Modal
    // ----------------------------------------------------
    function openPhotoModal(imgIndex) {
      if (!currentSeries || !currentSeries.images[imgIndex]) return;
      const img = currentSeries.images[imgIndex];

      photoModalImg.src = img.url;
      photoModalImg.classList.remove('zoomed');

      modalPhotoIndex.textContent = `ARTWORK [0${imgIndex + 1} / 0${currentSeries.count}]`;
      modalPhotoTitle.textContent = img.name.replace(/\.[^/.]+$/, "").replace(/_/g, " ");
      modalPhotoDims.textContent = `${img.width} × ${img.height}`;
      modalPhotoSize.textContent = `${(img.size / (1024 * 1024)).toFixed(2)} MB`;
      modalDownloadBtn.href = img.url;
      modalDownloadBtn.download = img.name;

      photoModalView.classList.add('active');
    }

    function closePhotoModal() {
      photoModalView.classList.remove('active');
      photoModalImg.src = '';
    }

    photoModalCloseBtn.addEventListener('click', closePhotoModal);
    photoModalImg.addEventListener('click', () => {
      photoModalImg.classList.toggle('zoomed');
    });

    // ----------------------------------------------------
    // J. 路由分发器 (Hash Routing)
    // ----------------------------------------------------
    function handleHashRouting() {
      const hash = window.location.hash || '#/';
      const parts = hash.replace(/^#\/?/, '').split('/');

      if (parts[0] === 'series' && parts[1]) {
        const seriesId = decodeURIComponent(parts[1]);
        openSeriesStage(seriesId);
      } else {
        if (currentView !== 'home') {
          triggerCurtain('GALLERY OVERVIEW', () => {
            currentView = 'home';
            viewStage.classList.remove('current');
            viewHome.classList.add('current');
            homeBtn.classList.add('active');
            applyTheme(SERIES_THEMES[0]);
            audioEngine.fadeOut(0.8);
          }, 'up');
        }
      }
    }

    window.addEventListener('hashchange', handleHashRouting);

    // ----------------------------------------------------
    // K. 交互事件
    // ----------------------------------------------------
    function goHome() {
      window.location.hash = '#/';
      searchInput.value = '';
      currentFilter = '';
      searchClearBtn.classList.remove('visible');
      searchShortcut.style.display = 'block';
      renderHomeGrid();
    }
    homeBtn.addEventListener('click', goHome);
    brandBtn.addEventListener('click', goHome);
    navRefHomeBtn.addEventListener('click', goHome);
    navRefPageBtn.addEventListener('click', goHome);

    searchInput.addEventListener('input', (e) => {
      currentFilter = e.target.value;
      if (currentFilter.length > 0) {
        searchClearBtn.classList.add('visible');
        searchShortcut.style.display = 'none';
      } else {
        searchClearBtn.classList.remove('visible');
        searchShortcut.style.display = 'block';
      }
      if (currentView !== 'home') {
        window.location.hash = '#/';
      }
      renderHomeGrid();
    });
    searchInput.addEventListener('focus', () => {
      searchWrapper.classList.add('focused');
      searchShortcut.style.display = 'none';
    });
    searchInput.addEventListener('blur', () => {
      searchWrapper.classList.remove('focused');
      if (!searchInput.value) searchShortcut.style.display = 'block';
    });
    searchClearBtn.addEventListener('click', () => {
      searchInput.value = '';
      currentFilter = '';
      searchClearBtn.classList.remove('visible');
      searchShortcut.style.display = 'block';
      searchInput.focus();
      renderHomeGrid();
    });

    audioToggleBtn.addEventListener('click', () => {
      const isPlaying = audioEngine.toggle();
      if (isPlaying) {
        audioToggleBtn.classList.add('playing');
        audioStatusText.textContent = 'AUDIO // ON';
      } else {
        audioToggleBtn.classList.remove('playing');
        audioStatusText.textContent = 'AUDIO // OFF';
      }
    });

    // 键盘快捷键 (左右箭头轮转卡片，Esc返回)
    window.addEventListener('keydown', (e) => {
      if (photoModalView.classList.contains('active')) {
        if (e.key === 'Escape') closePhotoModal();
        return;
      }
      if (currentView === 'stage') {
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
          stage3DController.targetScroll += 1;
          stage3DController.scheduleSnap();
        } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
          stage3DController.targetScroll -= 1;
          stage3DController.scheduleSnap();
        } else if (e.key === 'Escape') {
          goHome();
        }
        return;
      }
      if ((e.key === '/' || (e.ctrlKey && e.key === 'k')) && document.activeElement !== searchInput) {
        e.preventDefault();
        searchInput.focus();
        searchInput.select();
      } else if (e.key === 'Escape' && document.activeElement === searchInput) {
        searchInput.blur();
      }
    });

    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, t => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[t] || t));
    }

    document.addEventListener('click', function unlockAudio() {
      audioEngine.initContext();
      document.removeEventListener('click', unlockAudio);
    }, { once: true });

    initData();
  </script>
</body>
